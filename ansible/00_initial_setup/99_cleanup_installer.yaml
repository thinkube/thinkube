---
# 99_cleanup_installer.yaml - Remove temporary installer artifacts
#
# Purpose:
#   Removes passwordless sudo that was added during SSH setup for the installer.
#   thinkube-control passes ANSIBLE_BECOME_PASSWORD via env var, so passwordless
#   sudo is not needed after installation.
#
# Run with:
#   ./scripts/tk_ansible ansible/00_initial_setup/99_cleanup_installer.yaml

- name: Cleanup Installer Artifacts
  hosts: baremetal
  become: true
  gather_facts: false

  tasks:
    # 10_setup_ssh_keys.yaml writes this file as /etc/sudoers.d/{{ ansible_user }}
    # and is right to: it runs from the installer's minimal inventory, which
    # carries ansible_user and nothing else. This playbook runs from the full
    # inventory, which carries system_username and never sets ansible_user, so
    # naming the file the same way here left it undefined and the play failed
    # on its first task. Both names are the same account; only the inventory
    # that supplies them differs.
    - name: Remove passwordless sudo for system user
      ansible.builtin.file:
        path: "/etc/sudoers.d/{{ system_username }}"
        state: absent

    - name: Verify sudo still works with password
      ansible.builtin.command: whoami
      become: true
      changed_when: false
