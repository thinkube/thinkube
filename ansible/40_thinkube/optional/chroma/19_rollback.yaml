---
# ansible/40_thinkube/optional/chroma/19_rollback.yaml
# Description:
#   Rollback Chroma deployment and clean up resources
#   This playbook removes Chroma and optionally its persistent data
#
# Requirements:
#   - Kubernetes (kubeadm) kubectl access
#   - Chroma must be deployed
#
# Usage:
#   cd ~/thinkube
#   # Basic rollback (preserves data):
#   ./scripts/run_ansible.sh ansible/40_thinkube/optional/chroma/19_rollback.yaml
#
#   # Complete cleanup (removes data):
#   ./scripts/run_ansible.sh ansible/40_thinkube/optional/chroma/19_rollback.yaml -e remove_data=true
#
# Variables from inventory:
#   - kubeconfig: Path to kubeconfig file
#
# Extra variables:
#   - remove_data: Set to true to remove persistent data (default: false)
#
# 🤖 AI-assisted

- name: Rollback Chroma deployment
  hosts: k8s_control_plane
  gather_facts: true

  vars:
    chroma_namespace: "chroma"
    remove_data: false
    force_namespace_deletion: false

  tasks:
    - name: Display rollback configuration
      ansible.builtin.debug:
        msg: |
          Starting Chroma rollback with the following configuration:
          - Namespace: {{ chroma_namespace }}
          - Remove persistent data: {{ remove_data }}
          - Force namespace deletion: {{ force_namespace_deletion }}

    # Each name is the one 10_deploy.yaml creates. Deleting an object that
    # is already gone succeeds, so any error here is a real one.
    - name: Delete the Chroma gateway policy and route
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ chroma_namespace }}"
      loop:
        - { api_version: gateway.envoyproxy.io/v1alpha1, kind: SecurityPolicy, name: chroma-api-key }
        - { api_version: gateway.networking.k8s.io/v1, kind: HTTPRoute, name: chroma-route }

    - name: Delete Chroma services
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Service
        name: "{{ item }}"
        namespace: "{{ chroma_namespace }}"
      loop:
        - chromadb-svc
        - chromadb-headless

    - name: Delete the Chroma StatefulSet and wait for its pods to end
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: apps/v1
        kind: StatefulSet
        name: chroma
        namespace: "{{ chroma_namespace }}"
        wait: true
        wait_timeout: 120

    - name: Delete ConfigMaps
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: ConfigMap
        name: "{{ item }}"
        namespace: "{{ chroma_namespace }}"
      loop:
        - thinkube-service-config

    - name: Delete secrets
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ chroma_namespace }}"
      loop:
        - chroma-auth
        - chroma-gateway-api-keys
        - chroma-tls-secret

    - name: Delete PersistentVolumeClaim if remove_data is true
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        name: chroma-data-pvc
        namespace: "{{ chroma_namespace }}"
      when: remove_data | bool

    - name: Get remaining resources in namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: "{{ chroma_namespace }}"
      loop:
        - { api_version: v1, kind: Pod }
        - { api_version: v1, kind: Service }
        - { api_version: v1, kind: PersistentVolumeClaim }
        - { api_version: gateway.networking.k8s.io/v1, kind: HTTPRoute }
      register: remaining_resources

    - name: Display remaining resources
      ansible.builtin.debug:
        msg: >-
          Remaining in {{ chroma_namespace }}:
          {{ remaining_resources.results | map(attribute='resources') | flatten
             | map(attribute='kind') | zip(remaining_resources.results | map(attribute='resources')
             | flatten | map(attribute='metadata.name')) | map('join', ' ') | list }}
      when: remaining_resources.results | map(attribute='resources') | flatten | length > 0

    - name: Delete namespace if force_namespace_deletion is true
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ chroma_namespace }}"
      when: force_namespace_deletion | bool

    - name: Display rollback summary
      ansible.builtin.debug:
        msg: |
          ========================================
          Chroma Rollback Summary
          ========================================
          ✓ Deleted HTTPRoute
          ✓ Deleted Services
          ✓ Deleted ConfigMaps
          ✓ Deleted Secrets
          {% if remove_data %}
          ✓ Deleted PersistentVolumeClaim (data removed)
          {% else %}
          ℹ PersistentVolumeClaim preserved (data retained)
          {% endif %}
          {% if force_namespace_deletion %}
          ✓ Deleted namespace
          {% else %}
          ℹ Namespace preserved
          {% endif %}

          Rollback completed successfully!

          {% if not remove_data %}
          Note: Persistent data has been retained. To completely remove data, run:
          ./scripts/run_ansible.sh ansible/40_thinkube/optional/chroma/19_rollback.yaml -e remove_data=true
          {% endif %}