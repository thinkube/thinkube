---
# ansible/40_thinkube/optional/cvat/18_test.yaml
# Description:
#   Test the CVAT deployment and its logins:
#   - cvat.<domain> (browsers) sends a request without a login to Keycloak
#   - cvat-api.<domain> (CLI, SDK) serves /api with CVAT's own login only
#   - a client cannot log in by sending X-Auth-Request-Email itself
#
# Requirements:
#   - CVAT must be deployed (10_deploy.yaml)
#
# Usage:
#   tk_ansible ansible/40_thinkube/optional/cvat/18_test.yaml

- name: Test CVAT deployment
  hosts: k8s_control_plane
  gather_facts: false

  vars:
    cvat_namespace: cvat
    cvat_hostname: "cvat.{{ domain_name }}"
    cvat_api_hostname: "cvat-api.{{ domain_name }}"
    admin_password: "{{ lookup('env','ADMIN_PASSWORD') | default(lookup('env', 'ANSIBLE_BECOME_PASSWORD'), true) }}"

  tasks:
    - name: Check the CVAT deployments are ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ cvat_namespace }}"
        name: "{{ item }}"
      register: deployment_check
      failed_when: >-
        deployment_check.resources | length == 0
        or (deployment_check.resources[0].status.readyReplicas | default(0))
           != deployment_check.resources[0].spec.replicas
      loop: [cvat-backend, cvat-ui, opa]

    - name: Check the CVAT HTTPRoutes exist
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        namespace: "{{ cvat_namespace }}"
        name: "{{ item }}"
      register: route_check
      failed_when: route_check.resources | length == 0
      loop: [cvat-main-route, cvat-api-route, cvat-cli-api-route]

    - name: Check the gateway login policy is accepted
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: gateway.envoyproxy.io/v1alpha1
        kind: SecurityPolicy
        namespace: "{{ cvat_namespace }}"
        name: cvat-oidc
      register: oidc_policy
      failed_when: >-
        oidc_policy.resources | length == 0
        or (oidc_policy.resources[0].status.ancestors[0].conditions
            | selectattr('type', 'equalto', 'Accepted') | map(attribute='status') | list) != ['True']

    - name: Request browser paths without a login
      ansible.builtin.uri:
        url: "https://{{ cvat_hostname }}{{ item }}"
        follow_redirects: none
        status_code: [200, 302, 303, 401]
      register: browser_probe
      loop: ["/", "/api/users/self"]

    - name: Verify each browser path is sent to the Keycloak login
      ansible.builtin.assert:
        that:
          - item.status in [302, 303]
          - (item.location | default('')).startswith(keycloak_url ~ '/realms/' ~ keycloak_realm ~ '/protocol/openid-connect/auth')
        fail_msg: >-
          https://{{ cvat_hostname }}{{ item.item }} without a login answered
          {{ item.status }} {{ item.location | default('') }}.
      loop: "{{ browser_probe.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Request the CLI host without credentials
      ansible.builtin.uri:
        url: "https://{{ cvat_api_hostname }}/api/users/self"
        status_code: 401

    - name: Request the CLI host with a forged X-Auth-Request-Email header
      ansible.builtin.uri:
        url: "https://{{ cvat_api_hostname }}/api/users/self"
        headers:
          X-Auth-Request-Email: "{{ admin_username }}@{{ domain_name }}"
        status_code: 401

    - name: Request the CLI host with the CVAT admin password
      ansible.builtin.uri:
        url: "https://{{ cvat_api_hostname }}/api/users/self"
        url_username: "{{ admin_username }}"
        url_password: "{{ admin_password }}"
        force_basic_auth: true
        status_code: 200
      no_log: true

    - name: Request a path outside /api on the CLI host
      ansible.builtin.uri:
        url: "https://{{ cvat_api_hostname }}/"
        status_code: 404

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "CVAT deployments ready: cvat-backend, cvat-ui, opa"
          - "https://{{ cvat_hostname }} requires the Keycloak login"
          - "https://{{ cvat_api_hostname }}/api accepts only CVAT credentials"
          - "A forged X-Auth-Request-Email header does not log anyone in"
