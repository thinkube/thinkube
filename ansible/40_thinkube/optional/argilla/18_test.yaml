---
# ansible/40_thinkube/optional/argilla/18_test.yaml
# Description:
#   Test the Argilla deployment:
#   - the argilla Deployment is ready, with its Service and HTTPRoute
#   - argilla.<domain>/api/status answers through the gateway
#   - the API answers the default user's API key, and refuses a request
#     without one
#
# Requirements:
#   - Argilla must be deployed (11_deploy.yaml)
#
# Usage:
#   tk_ansible ansible/40_thinkube/optional/argilla/18_test.yaml

- name: Test Argilla deployment
  hosts: k8s_control_plane
  gather_facts: false

  vars:
    argilla_namespace: argilla
    argilla_hostname: "argilla.{{ domain_name }}"

  tasks:
    - name: Check the argilla Deployment is ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ argilla_namespace }}"
        name: argilla
      register: deployment_check
      failed_when: >-
        deployment_check.resources | length == 0
        or (deployment_check.resources[0].status.readyReplicas | default(0))
           != deployment_check.resources[0].spec.replicas

    - name: Check the argilla Service
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Service
        namespace: "{{ argilla_namespace }}"
        name: argilla
      register: service_check
      failed_when: service_check.resources | length == 0

    - name: Check the Argilla HTTPRoute
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        namespace: "{{ argilla_namespace }}"
        name: argilla-dashboard-route
      register: route_check
      failed_when: route_check.resources | length == 0

    # /api/v1/status is the API's own answer; other paths under /api fall
    # through to the web page, which answers 200 whatever the API's state.
    - name: Request Argilla's status through the gateway
      ansible.builtin.uri:
        url: "https://{{ argilla_hostname }}/api/v1/status"
        status_code: 200
        return_content: true
      register: status_probe

    - name: Verify the status names the version and the search engine
      ansible.builtin.assert:
        that:
          - status_probe.json.version is defined
          - status_probe.json.search_engine is defined
        fail_msg: "Argilla's status is not the API's answer: {{ status_probe.content[:300] }}"
        quiet: true

    - name: Read the default user's API key
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: "{{ argilla_namespace }}"
        name: argilla-secrets
      register: argilla_secrets
      failed_when: argilla_secrets.resources | length == 0
      no_log: true

    - name: Request the current user without an API key
      ansible.builtin.uri:
        url: "https://{{ argilla_hostname }}/api/v1/me"
        status_code: 401

    - name: Request the current user with the default user's API key
      ansible.builtin.uri:
        url: "https://{{ argilla_hostname }}/api/v1/me"
        headers:
          X-Argilla-Api-Key: "{{ argilla_secrets.resources[0].data.DEFAULT_USER_API_KEY | b64decode }}"
        status_code: 200
        return_content: true
      register: me_probe
      no_log: true

    - name: Verify the API key belongs to the admin user
      ansible.builtin.assert:
        that: me_probe.json.username == admin_username
        fail_msg: "The API key belongs to '{{ me_probe.json.username }}', not '{{ admin_username }}'"
        success_msg: "Argilla {{ status_probe.json.version }} answers {{ admin_username }}'s API key"
