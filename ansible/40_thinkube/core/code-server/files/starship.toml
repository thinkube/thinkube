format = """
[ ](bg:#a8dbe7)[ ](bg:#6cc0d4)[ ](bg:#2f9fbb)\
[ ](bg:#005a70 fg:#ffffff)\
$shell\
[ ](bg:#0a7d99 fg:#005a70)\
$directory\
[ ](fg:#0a7d99 bg:#2e9ab6)\
$git_branch\
$git_status\
[ ](fg:#2e9ab6 bg:#62b6cb)\
$nodejs\
$rust\
$golang\
$python\
[ ](fg:#62b6cb bg:#9ccfdc)\
$time\
[ ](fg:#9ccfdc)\
\n$character"""

[shell]
bash_indicator = "[ BASH ](bg:#005a70 fg:#ffffff)"
zsh_indicator = "[󰏰 ZSH ](bg:#005a70 fg:#ffffff)"
fish_indicator = "[󰈺 FISH ](bg:#005a70 fg:#ffffff)"
unknown_indicator = "[ ?? ](bg:#005a70 fg:#ffffff)"
format = "$indicator"
disabled = false
[directory]
style = "fg:#ffffff bg:#0a7d99"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "󰇚 Downloads"
"Music" = "󰝚 Music"
"Pictures" = "  Pictures"
"Videos" = "󰕧 Videos"
"Projects" = "  Projects"
"GitHub" = "󰊤 GitHub"
".config" = "  .config"
"Desktop" = "󰟀 Desktop"
[git_branch]
symbol = " "
style = "bg:#2e9ab6"
format = '[[ $symbol $branch ](fg:#002933 bg:#2e9ab6)]($style)'
[git_status]
style = "bg:#2e9ab6"
format = '[[($all_status$ahead_behind )](fg:#002933 bg:#2e9ab6)]($style)'
[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bg:#2e9ab6"
[nodejs]
symbol = "󰎙 "
style = "bg:#62b6cb"
format = '[[ $symbol ($version) ](fg:#002933 bg:#62b6cb)]($style)'
[rust]
symbol = " "
style = "bg:#62b6cb"
format = '[[ $symbol ($version) ](fg:#002933 bg:#62b6cb)]($style)'
[golang]
symbol = "󰟓 "
style = "bg:#62b6cb"
format = '[[ $symbol ($version) ](fg:#002933 bg:#62b6cb)]($style)'
[python]
symbol = "󰌠 "
style = "bg:#62b6cb"
format = '[[ $symbol ($version) ](fg:#002933 bg:#62b6cb)]($style)'
[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#9ccfdc"
format = '[[   $time ](fg:#002933 bg:#9ccfdc)]($style)'
[character]
success_symbol = "[❯](#16a34a)"
error_symbol = "[✗](#dc2626)"
vimcmd_symbol = "[❮](#16a34a)"
