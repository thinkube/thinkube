format = """
[ ](bg:#eab308 fg:#002933)\
$shell\
[ ](bg:#006680 fg:#eab308)\
$directory\
[ ](fg:#006680 bg:#805ad5)\
$git_branch\
$git_status\
[ ](fg:#805ad5 bg:#40647d)\
$nodejs\
$rust\
$golang\
$python\
[ ](fg:#40647d bg:#22829f)\
$time\
[ ](fg:#22829f)\
\n$character"""

[shell]
bash_indicator = "[ BASH ](bg:#eab308 fg:#002933)"
zsh_indicator = "[󰏰 ZSH ](bg:#eab308 fg:#002933)"
fish_indicator = "[󰈺 FISH ](bg:#eab308 fg:#002933)"
unknown_indicator = "[ ?? ](bg:#eab308 fg:#002933)"
format = "$indicator"
disabled = false
[directory]
style = "fg:#ffffff bg:#006680"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = "󰇚 Downloads"
"Music" = "󰝚 Music"
"Pictures" = "  Pictures"
"Videos" = "󰕧 Videos"
"Projects" = "  Projects"
"GitHub" = "󰊤 GitHub"
".config" = "  .config"
"Desktop" = "󰟀 Desktop"
[git_branch]
symbol = " "
style = "bg:#805ad5"
format = '[[ $symbol $branch ](fg:#ffffff bg:#805ad5)]($style)'
[git_status]
style = "bg:#805ad5"
format = '[[($all_status$ahead_behind )](fg:#ffffff bg:#805ad5)]($style)'
[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bg:#805ad5"
[nodejs]
symbol = "󰎙 "
style = "bg:#40647d"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#40647d)]($style)'
[rust]
symbol = " "
style = "bg:#40647d"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#40647d)]($style)'
[golang]
symbol = "󰟓 "
style = "bg:#40647d"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#40647d)]($style)'
[python]
symbol = "󰌠 "
style = "bg:#40647d"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#40647d)]($style)'
[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#22829f"
format = '[[   $time ](fg:#ffffff bg:#22829f)]($style)'
[character]
success_symbol = "[❯](#16a34a)"
error_symbol = "[✗](#dc2626)"
vimcmd_symbol = "[❮](#16a34a)"
