---
# ansible/40_thinkube/core/code-server/20_redeploy.yaml
# Description:
#   Rebuilds the code-server image and redeploys code-server on a running
#   installation. It runs the same component playbooks as 00_install.yaml,
#   except 13_clone_repositories.yaml: the workspace repositories hold the
#   user's work and are left untouched.
#
#   Redeploying restarts the code-server pod, so this playbook must not run
#   from inside code-server. thinkube-control runs it (redeploy_code_server).
#
# Requirements:
#   - code-server installed with 00_install.yaml
#   - Harbor registry deployed and accessible
#
# Usage (from thinkube-control):
#   ansible-playbook -i <inventory> ansible/40_thinkube/core/code-server/20_redeploy.yaml
#
# Variables from inventory:
#   - All variables required by the imported playbooks
#

- name: Code-Server Redeploy - Build Image
  import_playbook: ../harbor-images/16_build_codeserver_image.yaml

- name: Code-Server Redeploy - Deploy
  import_playbook: 10_deploy.yaml

- name: Code-Server Redeploy - Configure Shell Environment
  import_playbook: 14_configure_shell.yaml

- name: Code-Server Redeploy - Configure Environment
  import_playbook: 15_configure_environment.yaml

- name: Code-Server Redeploy - Configure Gitea Integration
  import_playbook: 16_configure_gitea_integration.yaml

- name: Code-Server Redeploy - Configure Service Discovery
  import_playbook: 17_configure_discovery.yaml
