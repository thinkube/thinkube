---
# ansible/40_thinkube/core/thinkube-control/11_deploy_webhook_adapter.yaml
# Description:
#   Deploy Harbor webhook adapter for instant image updates via direct Git updates
#   This eliminates the 2-minute polling delay for a true "local development" experience
#   
#   Bootstrap capability: Can deploy before thinkube-control exists.
#
# Requirements:
#   - ArgoCD deployed
#   - Harbor registry deployed and accessible
#   - Python base image available in Harbor
#
# Usage:
#   cd ~/thinkube
#   ./scripts/run_ansible.sh ansible/40_thinkube/core/thinkube-control/11_deploy_webhook_adapter.yaml
#
# Variables from inventory:
#   - domain_name: Domain name for all services
#   - harbor_registry: Harbor registry hostname
#   - kubectl_bin: Path to kubectl binary
#   - kubeconfig: Path to Kubernetes configuration file
#
# Dependencies:
#   - CORE-009: ArgoCD deployed
#
# Post-deployment:
#   - Webhook adapter processes Harbor PUSH_ARTIFACT events and updates Git repos
#
# 🤖 [AI-assisted]

- name: Deploy Harbor Webhook Adapter
  hosts: k8s_control_plane
  gather_facts: true
  
  vars:
    adapter_namespace: "{{ argocd_namespace }}"
    adapter_name: "harbor-webhook-adapter"
    
  tasks:
    - name: Get sync webhook secret if it exists
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: "{{ adapter_namespace }}"
        name: "sync-webhook-secret"
      register: sync_secret_check

    - name: Set sync webhook secret
      ansible.builtin.set_fact:
        sync_webhook_secret: "{{ sync_secret_check.resources[0].data.webhook_secret | b64decode if sync_secret_check.resources else '' }}"

    - name: Delete existing webhook adapter ConfigMap
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: ConfigMap
        name: "{{ adapter_name }}-script"
        namespace: "{{ adapter_namespace }}"
      failed_when: false

    - name: Create webhook adapter ConfigMap with Python script
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ adapter_name }}-script"
            namespace: "{{ adapter_namespace }}"
            labels:
              version: "0.1.0"  # Support both ci-cd-pipeline and build-and-push templates
          data:
            adapter.py: |
              #!/usr/bin/env python3
              import os
              import sys
              import json
              import logging
              import requests
              import subprocess
              import tempfile
              import base64
              import hmac
              import hashlib
              import time
              import queue
              import re
              import threading
              from http.server import HTTPServer, BaseHTTPRequestHandler
              from urllib.parse import urlparse
              from datetime import datetime

              logging.basicConfig(level=logging.INFO)
              logger = logging.getLogger(__name__)

              # The Kubernetes API and Harbor are called without certificate
              # checks (verify=False); one warning per request would bury the log.
              import urllib3
              urllib3.disable_warnings()

              def required(name):
                  value = os.environ.get(name)
                  if not value:
                      raise SystemExit(f"{name} is not set; the adapter's Deployment sets it")
                  return value

              HARBOR_URL = required('HARBOR_URL')
              HARBOR_USER = required('HARBOR_USER')
              HARBOR_PASSWORD = required('HARBOR_PASSWORD')
              GITEA_URL = required('GITEA_URL')
              GITEA_USER = required('GITEA_USER')
              GITEA_PASSWORD = required('GITEA_PASSWORD')
              PORT = int(required('PORT'))
              SYNC_WEBHOOK_URL = required('SYNC_WEBHOOK_URL')
              # Empty means the sync webhook is called without a signature.
              SYNC_WEBHOOK_SECRET = os.environ.get('SYNC_WEBHOOK_SECRET', '')

              # A Kubernetes API, Harbor or Gitea call can fail for a moment (a DNS
              # lookup while a node restarts, two builds pushing at once). The same call
              # is tried again a few times; after the last try the error is raised and
              # the event is logged as an image that was not deployed.
              ATTEMPTS = 4
              PAUSE_SECONDS = 5


              class Retryable(Exception):
                  pass


              def with_retries(what, fn):
                  for attempt in range(1, ATTEMPTS + 1):
                      try:
                          return fn()
                      except (Retryable, requests.RequestException) as e:
                          if attempt == ATTEMPTS:
                              raise RuntimeError(f"{what} failed {ATTEMPTS} times: {e}") from e
                          logger.warning(f"{what} failed (attempt {attempt}/{ATTEMPTS}): {e}; trying again")
                          time.sleep(PAUSE_SECONDS * attempt)

              # A build tags its images with the UID of its workflow. Per-architecture images
              # (<uid>-arm64), latest and layer caches are not deployable; the push of the
              # image or index tagged with the bare UID is the one that completes a build.
              BUILD_TAG = re.compile(r'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
              WORKFLOWS_API = 'https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/namespaces/argo'
              # The annotation that tells thinkube-control's pipeline view why a build was not deployed
              SUPERSEDED = 'thinkube.io/deploy-superseded-by'


              def k8s_headers():
                  with open('/var/run/secrets/kubernetes.io/serviceaccount/token') as f:
                      return {'Authorization': f'Bearer {f.read()}'}


              def app_builds(repo_name):
                  """The build workflows of the app an image repository belongs to, by UID.

                  The repository is thinkube/<app>-<container>, so the app is a part of the
                  name ending at a dash; the workflows carry it as thinkube.io/app-name.
                  A failed request raises, so the caller can try again.
                  """
                  parts = repo_name.split('/', 1)[-1].split('-')
                  candidates = ['-'.join(parts[:i]) for i in range(1, len(parts))]
                  if not candidates:
                      return {}
                  response = requests.get(
                      f'{WORKFLOWS_API}/workflows',
                      params={'labelSelector': f"thinkube.io/app-name in ({','.join(candidates)})"},
                      headers=k8s_headers(), verify=False, timeout=10)
                  if response.status_code != 200:
                      raise Retryable(f"listing workflows answered {response.status_code}")
                  builds = {}
                  for wf in response.json().get('items', []):
                      meta = wf['metadata']
                      app = meta['labels']['thinkube.io/app-name']
                      builds[meta['uid']] = {
                          'name': meta['name'],
                          'app': app,
                          'created': meta['creationTimestamp'],
                      }
                  return builds


              def template_containers(app_name):
                  """The containers the app's WorkflowTemplate builds. Multi-arch builds have a
                  task per architecture (build-inference-amd64, build-inference-arm64) sharing
                  one container_name parameter."""
                  response = requests.get(f'{WORKFLOWS_API}/workflowtemplates/{app_name}-build',
                                          headers=k8s_headers(), verify=False, timeout=5)
                  if response.status_code != 200:
                      raise Retryable(f"WorkflowTemplate {app_name}-build answered {response.status_code}")
                  containers = []
                  for template in response.json().get('spec', {}).get('templates', []):
                      if template.get('name') not in ('ci-cd-pipeline', 'build-and-push'):
                          continue
                      for task in template.get('dag', {}).get('tasks', []):
                          task_name = task.get('name', '')
                          if not task_name.startswith('build-') or task_name in ('build-pipeline', 'build-and-push'):
                              continue
                          task_args = {a['name']: a['value'] for a in task.get('arguments', {}).get('parameters', [])}
                          name = task_args.get('container_name') or task_name.replace('build-', '')
                          if name not in containers:
                              containers.append(name)
                  return containers


              def mark_superseded(build, newer):
                  """Annotate a build that was not deployed because a newer one already was."""
                  response = requests.patch(
                      f"{WORKFLOWS_API}/workflows/{build['name']}",
                      json={'metadata': {'annotations': {SUPERSEDED: newer['name']}}},
                      headers={**k8s_headers(), 'Content-Type': 'application/merge-patch+json'},
                      verify=False, timeout=10)
                  if response.status_code != 200:
                      raise Retryable(f"annotating {build['name']} answered {response.status_code}")
              def check_harbor_image(project, repo, tag):
                  """True when the image is in Harbor, False when Harbor says it is not; any other answer raises."""
                  url = f"{HARBOR_URL}/api/v2.0/projects/{project}/repositories/{repo}/artifacts/{tag}"
                  response = requests.get(url, auth=(HARBOR_USER, HARBOR_PASSWORD), verify=False, timeout=10)
                  if response.status_code == 200:
                      return True
                  if response.status_code == 404:
                      return False
                  raise Retryable(f"Harbor answered {response.status_code} for {project}/{repo}:{tag}")

              def trigger_argocd_sync(app_name):
                  """Ask the sync webhook to sync the app's Argo CD application, the only
                  trigger of a deploy: no application syncs by itself. A refusal raises."""
                  payload_json = json.dumps({"application": app_name})
                  headers = {"Content-Type": "application/json"}
                  if SYNC_WEBHOOK_SECRET:
                      headers["X-Webhook-Signature"] = hmac.new(
                          SYNC_WEBHOOK_SECRET.encode('utf-8'), payload_json.encode('utf-8'), hashlib.sha256).hexdigest()
                  response = requests.post(SYNC_WEBHOOK_URL, data=payload_json, headers=headers, timeout=30)
                  if response.status_code != 200:
                      raise Retryable(f"sync of {app_name} answered {response.status_code}: {response.text[:200]}")
                  logger.info(f"Triggered sync for {app_name}")
              def update_git_with_images(app_name, tag, containers, build, builds):
                  """Write the image tags to the app's Gitea repository, push, and sync.

                  A failed clone, push or sync raises Retryable: each try starts from a
                  fresh clone, so a push rejected because another build pushed first
                  succeeds on top of that build's commit. A build older than the one
                  whose tags are already written is not deployed: returns the newer build.
                  """
                  with tempfile.TemporaryDirectory() as temp_dir:
                      repo_url = f"{GITEA_URL}/thinkube-deployments/{app_name}.git"
                      repo_dir = os.path.join(temp_dir, app_name)

                      # Clone repository
                      clone_cmd = [
                          'git', 'clone', '--depth', '1', '--branch', 'main',
                          repo_url.replace('https://', f'https://{GITEA_USER}:{GITEA_PASSWORD}@'),
                          repo_dir
                      ]
                      result = subprocess.run(clone_cmd, capture_output=True, text=True, timeout=30)
                      if result.returncode != 0:
                          raise Retryable(f"git clone failed: {result.stderr.strip()}")

                      # Update .argocd-source file
                      argocd_file = os.path.join(repo_dir, 'k8s', f'.argocd-source-{app_name}.yaml')

                      # Builds start in the order of their pushes; a build that
                      # finishes after a newer one must not replace its images.
                      # The written tag is the UID of the build that made it.
                      if os.path.exists(argocd_file):
                          with open(argocd_file) as f:
                              written = [line.rsplit(':', 1)[-1].strip() for line in f if line.strip().startswith('- ')]
                          current = builds.get(written[0]) if written else None
                          if current and written[0] != tag and current['created'] > build['created']:
                              logger.info(f"Not deploying {app_name}:{tag}: the newer build {current['name']} is deployed")
                              return current

                      # Create/update the ArgoCD source file with new image tags
                      image_list = []
                      for container in containers:
                          image_list.append(f'{{ harbor_registry }}/thinkube/{app_name}-{container["name"]}:{tag}')

                      # Write updated content
                      os.makedirs(os.path.dirname(argocd_file), exist_ok=True)
                      with open(argocd_file, 'w') as f:
                          # Write YAML manually to ensure correct format
                          f.write('kustomize:\n')
                          f.write('  images:\n')
                          for image in image_list:
                              f.write(f'  - {image}\n')

                      # Configure git user
                      subprocess.run(['git', 'config', 'user.name', 'harbor-webhook-adapter'],
                                   cwd=repo_dir, timeout=10)
                      subprocess.run(['git', 'config', 'user.email', 'webhook@thinkube.com'],
                                   cwd=repo_dir, timeout=10)

                      # Commit changes
                      subprocess.run(['git', 'add', '.'], cwd=repo_dir, timeout=10)
                      commit_msg = f"build: automatic update of {app_name} to {tag}"
                      commit_result = subprocess.run(['git', 'commit', '-m', commit_msg],
                                                   cwd=repo_dir, capture_output=True, text=True, timeout=10)

                      if commit_result.returncode != 0:
                          if "nothing to commit" in commit_result.stdout:
                              # Written already, by a try whose sync failed
                              logger.info(f"Tags of {app_name}:{tag} already written")
                              trigger_argocd_sync(app_name)
                              return None
                          else:
                              raise RuntimeError(f"git commit failed: {commit_result.stderr.strip()}")

                      # Push changes
                      push_result = subprocess.run(['git', 'push'], cwd=repo_dir,
                                                 capture_output=True, text=True, timeout=30)
                      if push_result.returncode != 0:
                          raise Retryable(f"git push failed: {push_result.stderr.strip()}")

                      logger.info(f"Successfully updated git for {app_name} with tag {tag}")
                      trigger_argocd_sync(app_name)
                      return None

              def process_event(webhook_data):
                  """Deploy the build an image push completes, once every container's image
                  of that build is in Harbor."""
                  if webhook_data.get('type') != 'PUSH_ARTIFACT':
                      return
                  event_data = webhook_data.get('event_data', {})
                  repo_name = event_data.get('repository', {}).get('repo_full_name', '')
                  if repo_name.endswith('/cache'):
                      return
                  tags = [r.get('tag', '') for r in event_data.get('resources', [])]
                  tag = next((t for t in tags if BUILD_TAG.match(t)), None)
                  if tag is None:
                      return
                  logger.info(f"Image pushed: {repo_name}:{tag}")

                  builds = with_retries(f"workflows of {repo_name}", lambda: app_builds(repo_name))
                  build = builds.get(tag)
                  if build is None:
                      logger.error(f"IMAGE NOT DEPLOYED: {repo_name}:{tag}: no build workflow has UID {tag}")
                      return
                  app_name = build['app']
                  containers = with_retries(f"WorkflowTemplate {app_name}-build", lambda: template_containers(app_name))
                  if not containers:
                      logger.error(f"IMAGE NOT DEPLOYED: {app_name}:{tag}: its WorkflowTemplate builds no container")
                      return

                  missing = [c for c in containers if not with_retries(
                      f"Harbor check of {app_name}-{c}:{tag}", lambda c=c: check_harbor_image('thinkube', f'{app_name}-{c}', tag))]
                  if missing:
                      logger.info(f"{app_name}:{tag} waits for the images of {missing}")
                      return

                  newer = with_retries(f"Gitea update of {app_name} to {tag}",
                                       lambda: update_git_with_images(app_name, tag, [{'name': c} for c in containers], build, builds))
                  if newer is not None:
                      with_retries(f"marking {build['name']} as superseded",
                                   lambda: mark_superseded(build, newer))


              # Events are handled one at a time, in the order they arrive: two builds of
              # one app never write their tags at the same time, and the memory used does
              # not grow with the number of pushes.
              EVENTS = queue.Queue()


              def handle_events():
                  while True:
                      webhook_data = EVENTS.get()
                      try:
                          process_event(webhook_data)
                      except Exception as e:
                          repo = webhook_data.get('event_data', {}).get('repository', {}).get('repo_full_name', '?')
                          logger.error(f"IMAGE NOT DEPLOYED: event for {repo}: {e}")
                          import traceback
                          logger.error(traceback.format_exc())
                      finally:
                          EVENTS.task_done()
              class WebhookHandler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      # Health check endpoint
                      if self.path == '/' or self.path == '/health':
                          self.send_response(200)
                          self.send_header('Content-type', 'application/json')
                          self.end_headers()
                          self.wfile.write(json.dumps({"status": "ok"}).encode())
                      else:
                          self.send_response(404)
                          self.end_headers()
                  
                  def do_POST(self):
                      if self.path != '/webhook':
                          self.send_response(404)
                          self.end_headers()
                          return
                      
                      try:
                          content_length = int(self.headers['Content-Length'])
                          post_data = self.rfile.read(content_length)
                          webhook_data = json.loads(post_data)
                          
                          # Log the webhook for debugging
                          logger.info(f"Received webhook: {webhook_data.get('type', 'unknown')}")
                          
                          EVENTS.put(webhook_data)
                          self.send_response(200)
                          self.send_header('Content-type', 'application/json')
                          self.end_headers()
                          self.wfile.write(json.dumps({"status": "queued"}).encode())
                          
                      except Exception as e:
                          logger.error(f"Error receiving webhook: {e}")
                          self.send_response(500)
                          self.end_headers()
                          self.wfile.write(json.dumps({"error": str(e)}).encode())
                  
                  def log_message(self, format, *args):
                      # Suppress default access logs
                      pass

              if __name__ == '__main__':
                  try:
                      logger.info(f"Starting webhook adapter on port {PORT}")
                      logger.info(f"Harbor URL: {HARBOR_URL}")
                      logger.info(f"Gitea URL: {GITEA_URL}")
                      # Add debug logging
                      logger.info(f"Creating HTTP server on 0.0.0.0:{PORT}")
                      threading.Thread(target=handle_events, daemon=True).start()
                      httpd = HTTPServer(('0.0.0.0', PORT), WebhookHandler)
                      logger.info("HTTP server created successfully, starting to serve...")
                      httpd.serve_forever()
                  except Exception as e:
                      logger.error(f"Failed to start webhook adapter: {e}")
                      import traceback
                      logger.error(traceback.format_exc())
                      sys.exit(1)

    - name: Create ServiceAccount for webhook adapter
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "{{ adapter_name }}"
            namespace: "{{ adapter_namespace }}"

    - name: Create ClusterRole for webhook adapter
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: "{{ adapter_name }}-configmap-reader"
          rules:
          - apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list"]
          - apiGroups: ["argoproj.io"]
            resources: ["workflowtemplates"]
            verbs: ["get", "list"]
          # patch: a build that is not deployed because a newer one is gets an annotation
          - apiGroups: ["argoproj.io"]
            resources: ["workflows"]
            verbs: ["get", "list", "patch"]

    - name: Create ClusterRoleBinding
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "{{ adapter_name }}-configmap-reader"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: "{{ adapter_name }}-configmap-reader"
          subjects:
          - kind: ServiceAccount
            name: "{{ adapter_name }}"
            namespace: "{{ adapter_namespace }}"

    - name: Deploy webhook adapter
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ adapter_name }}"
            namespace: "{{ adapter_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "{{ adapter_name }}"
            template:
              metadata:
                labels:
                  app: "{{ adapter_name }}"
              spec:
                serviceAccountName: "{{ adapter_name }}"
                # The adapter turns each pushed image into an ArgoCD sync; it
                # stays on the control plane, off the worker nodes that
                # training mode reserves.
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                containers:
                - name: adapter
                  # python-base carries git, requests and pyyaml: nothing is installed at start
                  image: "{{ harbor_registry }}/library/python-base:3.12-slim"
                  command: ["python", "-u", "/app/adapter.py"]
                  env:
                  - name: HARBOR_URL
                    value: "https://registry.{{ domain_name }}"
                  - name: HARBOR_USER
                    value: "admin"
                  - name: HARBOR_PASSWORD
                    value: "{{ lookup('env', 'ADMIN_PASSWORD') | default(lookup('env', 'ANSIBLE_BECOME_PASSWORD'), true) }}"
                  - name: GITEA_URL
                    value: "https://git.{{ domain_name }}"
                  - name: GITEA_USER
                    value: "{{ admin_username }}"
                  - name: GITEA_PASSWORD
                    value: "{{ lookup('env', 'ADMIN_PASSWORD') | default(lookup('env', 'ANSIBLE_BECOME_PASSWORD'), true) }}"
                  - name: PORT
                    value: "8080"
                  - name: SYNC_WEBHOOK_URL
                    value: "http://argocd-sync-webhook.{{ adapter_namespace }}.svc.cluster.local/sync"
                  - name: SYNC_WEBHOOK_SECRET
                    value: "{{ sync_webhook_secret | default('') }}"
                  ports:
                  - containerPort: 8080
                    name: http
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
                  livenessProbe:
                    httpGet:
                      path: /
                      port: 8080
                    initialDelaySeconds: 10
                    periodSeconds: 30
                  readinessProbe:
                    httpGet:
                      path: /
                      port: 8080
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  volumeMounts:
                  - name: script
                    mountPath: /app
                volumes:
                - name: script
                  configMap:
                    name: "{{ adapter_name }}-script"

    - name: Create Service for webhook adapter
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ adapter_name }}"
            namespace: "{{ adapter_namespace }}"
          spec:
            selector:
              app: "{{ adapter_name }}"
            ports:
            - port: 80
              targetPort: 8080
              name: http

    - name: Create HTTPRoute for webhook adapter
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: "{{ adapter_name }}"
            namespace: "{{ adapter_namespace }}"
          spec:
            parentRefs:
              - name: "{{ gateway_name }}"
                namespace: "{{ gateway_namespace }}"
                sectionName: https
            hostnames:
              - "{{ adapter_name }}.{{ domain_name }}"
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - name: "{{ adapter_name }}"
                    port: 80

    - name: Wait for deployment to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ adapter_namespace }}"
        name: "{{ adapter_name }}"
        wait: true
        wait_condition:
          type: Progressing
          status: "True"
        wait_timeout: 300

    - name: Restart webhook adapter pods
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ adapter_name }}"
            namespace: "{{ adapter_namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  restartedAt: "{{ ansible_facts.date_time.iso8601 }}"

    - name: Get admin password from environment
      ansible.builtin.set_fact:
        admin_password: "{{ lookup('env', 'ADMIN_PASSWORD') | default(lookup('env', 'ANSIBLE_BECOME_PASSWORD'), true) }}"
      when: admin_password is not defined
      delegate_to: localhost
    
    - name: Debug admin credentials
      ansible.builtin.debug:
        msg: 
          - "Using admin username: {{ admin_username }}"
          - "Using admin password: {{ admin_password | length }} characters"
          - "Harbor URL: https://{{ harbor_registry }}/api/v2.0/projects/{{ harbor_project }}/webhook/policies"

    - name: Configure Harbor webhook for thinkube project
      when: not (skip_webhook_config | default(false))
      ansible.builtin.uri:
        url: "https://{{ harbor_registry }}/api/v2.0/projects/{{ harbor_project }}/webhook/policies"
        method: POST
        headers:
          Authorization: "Basic {{ ('admin:' + admin_password) | b64encode }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "ArgoCD Git Updater"
          description: "Update Git repository on image push"
          enabled: true
          targets:
            - type: "http"
              address: "https://{{ adapter_name }}.{{ domain_name }}/webhook"
              skip_cert_verify: true
          event_types:
            - "PUSH_ARTIFACT"
      register: webhook_create
      failed_when: webhook_create.status not in [201, 409]
      changed_when: webhook_create.status == 201

    - name: Check if webhook already exists
      ansible.builtin.debug:
        msg: "Harbor webhook already configured"
      when: 
        - not (skip_webhook_config | default(false))
        - webhook_create.status == 409

    - name: Verify webhook secret consistency
      ansible.builtin.debug:
        msg: |
          Webhook adapter using secret: {{ sync_webhook_secret | default('NOT SET') }}
          Secret length: {{ sync_webhook_secret | length if sync_webhook_secret else 0 }} characters
      when: sync_webhook_secret is defined

    - name: Display webhook adapter status
      ansible.builtin.debug:
        msg: |
          
          ════════════════════════════════════════════════════════
          ✅ Harbor Webhook Adapter Deployed Successfully
          ════════════════════════════════════════════════════════
          
          Adapter URL: https://{{ adapter_name }}.{{ domain_name }}/webhook
          Sync Webhook Secret: {{ 'Configured (' + (sync_webhook_secret | length | string) + ' chars)' if sync_webhook_secret else 'Not configured' }}
          
          The CI/CD pipeline is now optimized for instant deployment:
          1. Push code → Build (~1 min)
          2. Harbor webhook → Git update (instant)
          3. Git commit → ArgoCD webhook (instant)
          4. ArgoCD deploys (30 sec)
          
          Total time: ~1.5 minutes (from push to deployment)
          
          This provides a near-local development experience!
          ════════════════════════════════════════════════════════