---
# The LLM gateway's model aliases: the one place they are defined.
#
# The gateway (llm.<domain>) answers an alias as the model it names
# (thinkube-control/12_deploy*.yaml pass the table to its MODEL_ALIASES).
# The agentic clients in code-server name only aliases, never a model id
# (roles/agent_clients, run by thinkube-control/13_configure_code_server.yaml,
# builds their configs from this table). Pointing an alias at another model changes every client.
#
# model:          model id in the model catalog (thinkube-metadata models.json)
# name:           label the clients show
# context_window: the context the model is served with, not the length it
#                 supports (the catalog's context_length). Thinkube Control
#                 loads with the largest of 32768, 16384 and 8192 that fits
#                 the node (backend llm_lifecycle.py CONTEXT_CHOICES); load
#                 these models at 32768, or the clients overrun the server.
# max_output:     the answer budget the clients reserve inside that window
thinkube_model_aliases:
  thinkube-fast:
    model: nvidia/Qwen3.6-35B-A3B-NVFP4
    name: Thinkube fast (Qwen3.6 35B-A3B NVFP4)
    context_window: 32768
    max_output: 8192
  thinkube-deep:
    model: nvidia/Qwen3.8-27B-NVFP4
    name: Thinkube deep (Qwen3.8 27B NVFP4)
    context_window: 32768
    max_output: 8192

# alias -> model id, the form the gateway reads.
thinkube_model_alias_map: "{{ dict(thinkube_model_aliases.keys() | zip(thinkube_model_aliases.values() | map(attribute='model'))) }}"
