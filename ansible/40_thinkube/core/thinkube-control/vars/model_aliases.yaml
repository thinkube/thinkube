---
# The models the agentic clients in code-server are configured with
# (roles/agent_clients, run by thinkube-control/13_configure_code_server.yaml,
# builds their configs from this table). The gateway (llm.<domain>) takes its
# aliases from the model catalog (thinkube-metadata models.json, "aliases");
# each alias here must be one of them.
#
# model:          model id in the model catalog (thinkube-metadata models.json)
# name:           label the clients show
# context_window: the context the model is served with, not the length it
#                 supports (the catalog's context_length). A load that names
#                 no context gets the largest of 32768, 16384 and 8192 that
#                 fits the node (backend llm_lifecycle.py CONTEXT_CHOICES), so
#                 load each model with max_context_length set to this value,
#                 or the clients overrun the server.
# max_output:     the answer budget the clients reserve inside that window
thinkube_model_aliases:
  # On tkspark (DGX Spark) vLLM allocates KV cache for 934,356 tokens for this
  # model, so its full 262144 context fits.
  thinkube-fast:
    model: nvidia/Qwen3.6-35B-A3B-NVFP4
    name: Thinkube fast (Qwen3.6 35B-A3B NVFP4)
    context_window: 262144
    max_output: 32768
    # Answers questions about images through the gateway (checked with a test
    # image); the agents may send it screenshots and pasted images.
    vision: true
  # Its KV cache need per token is not measured yet: 32768 is the default load
  # context until it is.
  thinkube-deep:
    model: nvidia/Qwen3.8-27B-NVFP4
    name: Thinkube deep (Qwen3.8 27B NVFP4)
    context_window: 32768
    max_output: 8192
  # Served by Flare on a DGX Spark. Flare serves the context its package was
  # prepared with, 262144 tokens per request, whatever the load names.
  # Thinking on and off, tool calls and images were checked through the
  # gateway.
  thinkube-flash-next:
    model: local-inference-lab/Qwen3.8-Flash-Next-FLARE
    name: Thinkube flash next (Qwen3.8 Flash Next, Flare)
    context_window: 262144
    max_output: 32768
    vision: true

# alias -> model id, the form the gateway reads.
thinkube_model_alias_map: "{{ dict(thinkube_model_aliases.keys() | zip(thinkube_model_aliases.values() | map(attribute='model'))) }}"
