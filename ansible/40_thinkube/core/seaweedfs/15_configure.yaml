---
# ansible/40_thinkube/core/seaweedfs/15_configure.yaml
# Description:
#   Configure SeaweedFS S3 access and create initial buckets
#   Sets up S3 credentials and creates buckets for Argo, Harbor, etc.
#
# Requirements:
#   - SeaweedFS must be deployed (10_deploy.yaml)
#   - kubectl access configured
#
# Usage:
#   cd ~/thinkube
#   ./scripts/run_ansible.sh ansible/40_thinkube/core/seaweedfs/15_configure.yaml
#
# Variables from inventory:
#   - seaweedfs_namespace: SeaweedFS namespace
#   - s3_access_key: S3 access key to configure
#   - s3_secret_key: S3 secret key to configure

- name: Configure SeaweedFS S3 access and buckets
  hosts: k8s_control_plane
  become: false
  gather_facts: true
  
  vars:
    # S3 credentials - will be fetched from secret
    # Buckets to create
    s3_buckets:
      - name: argo-artifacts
        description: "Argo Workflows artifacts"
      - name: harbor-storage
        description: "Harbor registry storage"
      - name: backup
        description: "System backups"
      - name: data
        description: "General data storage"
    
    # S3 endpoint
    s3_endpoint: "https://{{ object_storage_s3_hostname }}"
    s3_endpoint_internal: "http://seaweedfs-filer.{{ seaweedfs_namespace }}.svc.cluster.local:8333"

  tasks:
    - name: Check if SeaweedFS filer is ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: seaweedfs-filer
        namespace: "{{ seaweedfs_namespace }}"
      register: filer_status
      failed_when: 
        - filer_status.resources | length == 0 or filer_status.resources[0].status.readyReplicas != filer_status.resources[0].spec.replicas

    - name: Get filer pod name
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Pod
        namespace: "{{ seaweedfs_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=seaweedfs
          - app.kubernetes.io/component=filer
      register: filer_pods

    - name: Get S3 credentials from secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        name: seaweedfs-s3-config
        namespace: "{{ seaweedfs_namespace }}"
      register: s3_config_secret
      failed_when: s3_config_secret.resources | length == 0
      
    - name: Set S3 credentials from secret
      ansible.builtin.set_fact:
        s3_access_key: "{{ s3_config_secret.resources[0].data.access_key | b64decode }}"
        s3_secret_key: "{{ s3_config_secret.resources[0].data.secret_key | b64decode }}"

    - name: Read the S3 config mounted in the filer pod
      ansible.builtin.command: >-
        {{ kubectl_bin }} exec -n {{ seaweedfs_namespace }} {{ filer_pods.resources[0].metadata.name }}
        -- cat /etc/seaweedfs/s3-config.json
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: s3_config_mounted
      changed_when: false
      failed_when: false

    - name: Verify the S3 config file is mounted in the filer pod
      ansible.builtin.assert:
        that:
          - s3_config_mounted.rc == 0
        fail_msg: >-
          /etc/seaweedfs/s3-config.json is not readable in pod
          {{ seaweedfs_namespace }}/{{ filer_pods.resources[0].metadata.name }}:
          {{ s3_config_mounted.stderr }}.
          10_deploy.yaml mounts it from secret seaweedfs-s3-config by patching
          StatefulSet seaweedfs-filer. Run 10_deploy.yaml again and check the patch tasks.

    - name: Verify the filer runs with the mounted S3 config and the secret's credentials
      ansible.builtin.assert:
        that:
          - "'-s3.config=/etc/seaweedfs/s3-config.json' in (filer_pods.resources[0].spec.containers[0].command | join(' '))"
          - "(s3_config_mounted.stdout | from_json).identities
             | selectattr('name', 'equalto', 'admin')
             | map(attribute='credentials') | flatten
             | selectattr('accessKey', 'equalto', s3_access_key)
             | selectattr('secretKey', 'equalto', s3_secret_key)
             | list | length == 1"
        fail_msg: >-
          The S3 config is not in effect in pod
          {{ seaweedfs_namespace }}/{{ filer_pods.resources[0].metadata.name }}.
          The filer command must contain -s3.config=/etc/seaweedfs/s3-config.json,
          and the mounted file must hold the admin access_key and secret_key of
          secret seaweedfs-s3-config. Run 10_deploy.yaml again, then check
          the patched command and restart the filer pod if the secret changed.

    - name: Create S3 configuration secret for other services
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: seaweedfs-s3-credentials
            namespace: "{{ seaweedfs_namespace }}"
          type: Opaque
          stringData:
            access_key: "{{ s3_access_key }}"
            secret_key: "{{ s3_secret_key }}"
            endpoint: "{{ s3_endpoint }}"
            endpoint_internal: "{{ s3_endpoint_internal }}"

    - name: Install s3cmd for bucket operations
      ansible.builtin.package:
        name: s3cmd
        state: present
      become: true
      delegate_to: localhost

    - name: Create s3cmd config file
      ansible.builtin.template:
        src: s3cmd.cfg.j2
        dest: "/tmp/s3cmd-{{ seaweedfs_namespace }}.cfg"
        mode: '0600'
      delegate_to: localhost

    - name: Wait for S3 API to be ready
      ansible.builtin.uri:
        url: "{{ s3_endpoint }}"
        validate_certs: false
        status_code: [200, 403]
      retries: 30
      delay: 5
      delegate_to: localhost

    - name: Create S3 buckets
      ansible.builtin.shell: |
        s3cmd -c /tmp/s3cmd-{{ seaweedfs_namespace }}.cfg mb s3://{{ item.name }} || true
      loop: "{{ s3_buckets }}"
      delegate_to: localhost
      register: bucket_creation

    - name: List created buckets
      ansible.builtin.shell: |
        s3cmd -c /tmp/s3cmd-{{ seaweedfs_namespace }}.cfg ls
      delegate_to: localhost
      register: bucket_list

    - name: Clean up s3cmd config
      ansible.builtin.file:
        path: "/tmp/s3cmd-{{ seaweedfs_namespace }}.cfg"
        state: absent
      delegate_to: localhost

    - name: Display configuration summary
      ansible.builtin.debug:
        msg:
          - "SeaweedFS S3 configuration complete"
          - "-----------------------------------"
          - "S3 Access Key: {{ s3_access_key }}"
          - "S3 Endpoint (external): {{ s3_endpoint }}"
          - "S3 Endpoint (internal): {{ s3_endpoint_internal }}"
          - "-----------------------------------"
          - "Created buckets:"
          - "{{ bucket_list.stdout_lines }}"
          - "-----------------------------------"
          - "S3 credentials stored in:"
          - "  - Secret: {{ seaweedfs_namespace }}/seaweedfs-s3-credentials"
          - "  - Argo secret: argo/argo-artifacts-s3"
          - "-----------------------------------"
          - "To use with s3cmd:"
          - "  s3cmd --access_key={{ s3_access_key }} --secret_key=<secret> --host={{ object_storage_s3_hostname }} --host-bucket=%(bucket)s.{{ object_storage_s3_hostname }} ls"

