---
# ansible/40_thinkube/core/infrastructure/gpu_operator/00_install.yaml
# Description:
#   Complete NVIDIA GPU Operator installation and configuration. Kubernetes
#   hands out no GPU: the platform's Scheduler gives each GPU by its id.
#
# Usage:
#   cd ~/thinkube
#   ./scripts/run_ansible.sh ansible/40_thinkube/core/infrastructure/gpu_operator/00_install.yaml
#
# What this installs:
#   1. NVIDIA GPU Operator: the container toolkit (and its runtime classes)
#      and GPU feature discovery, without the device plugin
#   2. A GPU clock cap on GB10 (DGX Spark) nodes, so sustained load does not cut their power
#   3. GPU discovery configuration
#
# Supported GPUs:
#   - ARM64: DGX Spark GB10 (128GB unified memory)
#   - x86-64: RTX 3090, RTX 4090, and other consumer/workstation GPUs
#
# 🤖 [AI-assisted]

- name: Install GPU Operator
  ansible.builtin.import_playbook: 10_deploy.yaml

- name: Cap the GPU clock of GB10 nodes
  ansible.builtin.import_playbook: 12_cap_gb10_clock.yaml

- name: Configure GPU Discovery
  ansible.builtin.import_playbook: 17_configure_discovery.yaml
