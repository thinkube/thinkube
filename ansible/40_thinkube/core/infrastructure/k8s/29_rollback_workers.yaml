---
# ansible/40_thinkube/core/infrastructure/k8s/29_rollback_workers.yaml
#
# Rollback playbook for the Thinkube Kubernetes Cluster worker nodes
# (kubeadm-joined). It removes everything 20_join_workers.yaml added to
# each worker, so the worker is as it was before the join.
#
# WARNING: This drains, deletes, and wipes worker nodes. Pods scheduled
# only on these workers (no PV mirror on the control plane) are lost.
#
# Workflow:
#   1. On the control plane: drain each worker, then `kubectl delete node`.
#   2. On each worker: `kubeadm reset`, then remove the units, files,
#      packages, apt sources, UFW rules, network configuration and the
#      KUBE-* / CILIUM_* iptables chains the join added. SSH access is
#      kept: the SSH rules stay in UFW and UFW stays enabled.
#   3. On the control plane: final node count + summary.
#
# Usage:
#   ./scripts/run_ansible.sh ansible/40_thinkube/core/infrastructure/k8s/29_rollback_workers.yaml
#
# Confirmation is the orchestrator's responsibility (installer wizard,
# thinkube-control UI, or the operator explicitly invoking the script).
# This playbook contains no internal safety gates — invocation IS the
# commitment.
#
# 🤖 [AI-assisted]

- name: Drain and remove workers from the cluster
  hosts: k8s_control_plane
  become: false
  gather_facts: false

  vars:
    user: "{{ system_username }}"
    user_home: "/home/{{ user }}"
    kubectl_path: "{{ user_home }}/.local/bin/kubectl"
    drain_timeout: "300s"

  tasks:
    - name: Check which workers exist in the cluster
      ansible.builtin.command: "{{ kubectl_path }} get node {{ item }}"
      environment:
        KUBECONFIG: "{{ user_home }}/.kube/config"
      loop: "{{ groups['k8s_workers'] }}"
      register: _worker_exists
      failed_when: false
      changed_when: false

    - name: Drain worker nodes
      ansible.builtin.command: >
        {{ kubectl_path }} drain {{ item.item }}
        --ignore-daemonsets --delete-emptydir-data
        --timeout={{ drain_timeout }} --force
      environment:
        KUBECONFIG: "{{ user_home }}/.kube/config"
      loop: "{{ _worker_exists.results }}"
      when: item.rc == 0
      register: _drain_result
      failed_when: false
      changed_when: _drain_result.rc == 0

    - name: Wait for pods to be evicted
      ansible.builtin.pause:
        seconds: 30
        prompt: "Waiting for pods to be evicted from workers..."
      when: _drain_result is changed

    - name: Delete worker nodes from cluster
      ansible.builtin.command: "{{ kubectl_path }} delete node {{ item.item }}"
      environment:
        KUBECONFIG: "{{ user_home }}/.kube/config"
      loop: "{{ _worker_exists.results }}"
      when: item.rc == 0
      register: _delete_result
      changed_when: "'deleted' in _delete_result.stdout"
      failed_when: false

    - name: Display remaining cluster nodes
      ansible.builtin.command: "{{ kubectl_path }} get nodes"
      environment:
        KUBECONFIG: "{{ user_home }}/.kube/config"
      register: _remaining_nodes
      changed_when: false

    - name: Show remaining nodes
      ansible.builtin.debug:
        var: _remaining_nodes.stdout_lines


- name: Wipe worker nodes
  hosts: k8s_workers
  become: true
  gather_facts: true

  vars:
    user: "{{ system_username }}"
    user_home: "/home/{{ user }}"
    kubectl_path: "{{ user_home }}/.local/bin/kubectl"
    helm_path: "{{ user_home }}/.local/bin/helm"

    # Units the join writes to /etc/systemd/system. Sockets and timers
    # come before the services they start, so none is started again
    # while it is being stopped.
    worker_units:
      - k8s-api-proxy.socket
      - k8s-api-proxy.service
      - thinkube-node-ip-sync.timer
      - thinkube-node-ip-sync-watch.service
      - thinkube-node-ip-sync.service
      - thinkube-link-watchdog.timer
      - thinkube-link-watchdog.service

    # The units above that have an [Install] section and are enabled by
    # the join.
    worker_enabled_units:
      - k8s-api-proxy.socket
      - thinkube-node-ip-sync.timer
      - thinkube-node-ip-sync.service
      - thinkube-link-watchdog.timer

  tasks:
    # =====================================================================
    # kubeadm reset — drains the local kubelet state cleanly
    # =====================================================================
    - name: Check if kubeadm is installed
      ansible.builtin.stat:
        path: /usr/bin/kubeadm
      register: _kubeadm_binary

    - name: Run kubeadm reset
      ansible.builtin.command: kubeadm reset --force --cleanup-tmp-dir
      when: _kubeadm_binary.stat.exists
      register: _kubeadm_reset
      failed_when: false
      changed_when: _kubeadm_reset.rc == 0

    # =====================================================================
    # Wipe Thinkube-owned state
    # =====================================================================
    - name: Unmount any lingering kubelet pod volumes
      ansible.builtin.shell: |
        mount | awk '/\/var\/lib\/kubelet\/pods/ {print $3}' | xargs -r -I {} umount -l {} 2>/dev/null || true
      changed_when: false

    # Pod sandboxes leave their shm mounts, container rootfs mounts and
    # network namespaces under /run when containerd could not tear them
    # down; deepest paths first so a parent is never unmounted before its
    # children.
    - name: Unmount pod sandbox, container and pod network namespace mounts
      ansible.builtin.shell: |
        set -euo pipefail
        findmnt -rn -o TARGET \
          | awk '/^\/run\/containerd\/io\.containerd\.runtime\.v2\.task\/k8s\.io\// ||
                 /^\/run\/containerd\/io\.containerd\.grpc\.v1\.cri\// ||
                 /^\/run\/netns\/cni-/' \
          | sort -r \
          | while read -r target; do umount -l "$target"; echo "$target"; done
      args:
        executable: /bin/bash
      register: _pod_mounts
      changed_when: _pod_mounts.stdout | length > 0

    - name: Find pod network namespace files
      ansible.builtin.find:
        paths: /run/netns
        patterns: 'cni-*'
        file_type: any
      register: _pod_netns

    - name: Remove pod network namespace files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _pod_netns.files }}"
      loop_control:
        label: "{{ item.path }}"

    # kubelet's pod cgroup slice outlives kubelet; nothing is left in it
    # once the containers are gone.
    - name: Check for kubelet's pod cgroup slice
      ansible.builtin.command: systemctl list-units --all --plain --no-legend kubepods.slice
      register: _kubepods_slice
      changed_when: false

    - name: Stop kubelet's pod cgroup slice
      ansible.builtin.systemd:
        name: kubepods.slice
        state: stopped
      when: _kubepods_slice.stdout | length > 0

    - name: Remove cluster + runtime state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /etc/cni/net.d
        - /var/lib/kubelet
        - /var/openebs
        - /var/lib/rawfile-localpv
      failed_when: false

    # The rawfile-csi node DaemonSet runs on workers too and keeps its
    # volume images under /var/csi.
    - name: Remove CSI volume data, pod logs and the CNI result cache
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/csi
        - /var/log/pods
        - /var/log/containers
        - /var/lib/cni

    # Cilium's agent copies its CNI plugin next to the kubernetes-cni
    # binaries; removing it first lets the package purge below remove
    # /opt/cni with the rest of its files.
    - name: Remove the Cilium CNI plugin binary
      ansible.builtin.file:
        path: /opt/cni/bin/cilium-cni
        state: absent

    - name: Remove the files the join left in /tmp
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/kubeadm-join.yaml
        - /tmp/get-helm-3.sh

    - name: Remove vanilla kubectl / helm from ~/.local/bin
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ kubectl_path }}"
        - "{{ helm_path }}"

    # =====================================================================
    # Node-local API VIP (k8s0 dummy + socket proxy) — see 20_join_workers
    # =====================================================================
    - name: Check which API VIP proxy, node-ip sync and link watchdog unit files exist
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      loop: "{{ worker_units }}"
      register: _worker_unit_files

    - name: Stop API VIP proxy, node-ip sync and link watchdog units
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        state: stopped
      loop: "{{ _worker_unit_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    - name: Disable API VIP proxy socket, node-ip sync and link watchdog timer
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        enabled: false
      loop: "{{ _worker_unit_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists
        - item.item in worker_enabled_units

    - name: Remove API VIP proxy, node-ip sync, link watchdog and dummy interface files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/k8s-api-proxy.socket
        - /etc/systemd/system/k8s-api-proxy.service
        - /etc/systemd/system/thinkube-node-ip-sync.timer
        - /etc/systemd/system/thinkube-node-ip-sync-watch.service
        - /etc/systemd/system/thinkube-node-ip-sync.service
        - /usr/local/bin/thinkube-node-ip-sync
        - /etc/systemd/system/thinkube-link-watchdog.timer
        - /etc/systemd/system/thinkube-link-watchdog.service
        - /usr/local/bin/thinkube-link-watchdog
        - /etc/systemd/network/10-k8s-dummy.netdev
        - /etc/systemd/network/10-k8s-dummy.network
      register: _worker_unit_and_network_files

    - name: Remove the link watchdog's escalation state
      ansible.builtin.file:
        path: /run/thinkube-link-watchdog
        state: absent

    - name: Reload systemd after unit removal
      ansible.builtin.systemd:
        daemon_reload: true

    # A reload re-reads the files without touching the other links, so
    # the network carrying SSH is not reconfigured. networkd does not
    # delete a netdev whose file is gone; the next task does.
    # systemd-networkd stays enabled: on a host whose netplan renders to
    # networkd, disabling it takes the network, and SSH, down.
    - name: Reload systemd-networkd after dummy config removal
      ansible.builtin.command: networkctl reload
      when: _worker_unit_and_network_files is changed
      changed_when: true

    - name: Check whether the k8s0 dummy interface exists
      ansible.builtin.stat:
        path: /sys/class/net/k8s0
      register: _k8s0_link

    - name: Delete k8s0 dummy interface
      ansible.builtin.command: ip link delete k8s0
      when: _k8s0_link.stat.exists
      changed_when: true

    # =====================================================================
    # Kernel modules, sysctls and swap (kubeadm_install role)
    # =====================================================================
    # The modules stay loaded and the sysctl values stay set until the
    # next boot: unloading overlay or br_netfilter, or turning
    # ip_forward off, breaks any other container runtime or overlay
    # network on the host. sysctl --system re-applies every value the
    # remaining files set.
    - name: Remove Thinkube-owned kernel module and sysctl drop-ins
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/modules-load.d/thinkube-k8s.conf
        - /etc/sysctl.d/99-thinkube-k8s.conf
      register: _thinkube_sysctl_files

    # Cilium's apply-sysctl-overwrites init container writes this file on
    # the host.
    - name: Remove Cilium's sysctl override drop-in
      ansible.builtin.file:
        path: /etc/sysctl.d/99-zzz-override_cilium.conf
        state: absent
      register: _cilium_sysctl_file

    - name: Re-apply the remaining sysctl files
      ansible.builtin.command: sysctl --system
      when: _thinkube_sysctl_files is changed or _cilium_sysctl_file is changed
      changed_when: true

    # kubeadm_install comments swap lines out with this exact suffix.
    - name: Restore the swap entries the join commented out in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^# (.*)  # disabled by Thinkube \(kubeadm requirement\)$'
        replace: '\1'
      register: _fstab_swap

    - name: Turn swap back on
      ansible.builtin.command: swapon -a
      when: _fstab_swap is changed
      changed_when: true

    # =====================================================================
    # Packages, apt sources and containerd (kubeadm_install and
    # containerd_install roles)
    # =====================================================================
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: apt

    - name: Unhold kubeadm / kubelet / kubectl
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubeadm
        - kubelet
        - kubectl
      when: item in ansible_facts.packages

    # kubernetes-cni and cri-tools come in as dependencies of kubeadm and
    # kubelet. Other dependencies apt pulled in stay: apt autoremove would
    # take them, but also every other package already waiting for it.
    - name: Purge kubeadm / kubelet / kubectl / kubernetes-cni / cri-tools
      ansible.builtin.apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
          - kubernetes-cni
          - cri-tools
        state: absent
        purge: true

    # containerd.io is also Docker's runtime (DGX OS ships Docker from
    # Docker's repository). When an installed package depends on it
    # (docker-ce, or anything needing the containerd or runc it provides),
    # containerd.io, its config and its image store stay, and only the
    # Kubernetes namespace is emptied.
    - name: List installed packages that depend on containerd.io
      ansible.builtin.shell: |
        set -o pipefail
        apt-cache rdepends --installed --no-recommends --no-suggests \
          --no-conflicts --no-breaks --no-replaces --no-enhances \
          containerd.io containerd runc \
          | awk '/^[^ ]/ {next} {sub(/^[ |]+/, ""); if ($0 != "containerd.io" && $0 != "containerd" && $0 != "runc") print}' \
          | sort -u
      args:
        executable: /bin/bash
      register: _containerd_dependents
      when: "'containerd.io' in ansible_facts.packages"
      changed_when: false

    - name: Decide whether containerd.io stays
      ansible.builtin.set_fact:
        _containerd_kept: "{{ 'containerd.io' in ansible_facts.packages and (_containerd_dependents.stdout_lines | length > 0) }}"

    - name: Say why containerd.io stays
      ansible.builtin.debug:
        msg: >-
          containerd.io stays: {{ _containerd_dependents.stdout_lines | join(', ') }}
          depend on it. /etc/containerd/config.toml keeps the Thinkube settings;
          the images and containers of the k8s.io namespace are removed.
      when: _containerd_kept

    - name: Unhold containerd.io
      ansible.builtin.dpkg_selections:
        name: containerd.io
        selection: install
      when: "'containerd.io' in ansible_facts.packages"

    - name: Remove the Kubernetes namespace's containers and images from the kept containerd
      ansible.builtin.shell: |
        set -o pipefail
        ctr -n k8s.io containers ls -q | xargs -r ctr -n k8s.io containers rm
        ctr -n k8s.io images ls -q | xargs -r ctr -n k8s.io images rm
      args:
        executable: /bin/bash
      register: _k8s_namespace_cleanup
      when: _containerd_kept
      changed_when: _k8s_namespace_cleanup.stdout | length > 0

    - name: Purge containerd.io
      ansible.builtin.apt:
        name: containerd.io
        state: absent
        purge: true
      when: not _containerd_kept

    # Ubuntu's own containerd package, when installed, uses the same
    # paths and is not the join's.
    - name: Remove containerd config, image store and runtime state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/containerd
        - /var/lib/containerd
        - /run/containerd
      when:
        - not _containerd_kept
        - "'containerd' not in ansible_facts.packages"

    - name: Remove the Kubernetes apt source and key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/kubernetes.list
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      register: _k8s_apt_source

    # The Docker source stays with containerd.io, and with any other
    # package from Docker's repository (all named docker-*).
    - name: Remove the Docker apt source and key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/keyrings/docker.asc
      when:
        - not _containerd_kept
        - ansible_facts.packages.keys() | select('match', '^docker-') | list | length == 0
      register: _docker_apt_source

    - name: Update apt cache after removing the sources
      ansible.builtin.apt:
        update_cache: true
      when: _k8s_apt_source is changed or _docker_apt_source is changed
      register: _apt_update
      retries: 3
      delay: 10
      until: _apt_update is succeeded

    # =====================================================================
    # DNS: LLMNR drop-in
    # =====================================================================
    - name: Remove the LLMNR drop-in for systemd-resolved
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d/10-thinkube-llmnr.conf
        state: absent
      register: _llmnr_cleanup

    - name: Restart systemd-resolved to drop the LLMNR setting
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: _llmnr_cleanup is changed

    # =====================================================================
    # Cilium network interfaces left behind on the worker
    # =====================================================================
    - name: Enumerate Cilium-created interfaces
      ansible.builtin.shell: |
        ip -o link show | awk -F': ' '/cilium|lxc/ {print $2}' | sed 's/@.*//' | sort -u
      register: _cilium_interfaces
      changed_when: false

    - name: Delete Cilium-created interfaces
      ansible.builtin.command: "ip link delete {{ item }}"
      loop: "{{ _cilium_interfaces.stdout_lines | default([]) }}"
      when: _cilium_interfaces.stdout_lines | length > 0
      failed_when: false
      changed_when: true

    # Cilium attaches its BPF programs to the host interfaces through
    # links pinned under /sys/fs/bpf/cilium; removing the pins detaches
    # them, so the host interfaces carry traffic without Cilium again.
    - name: Remove Cilium's pinned BPF programs, links and maps
      ansible.builtin.file:
        path: /sys/fs/bpf/cilium
        state: absent

    - name: Find Cilium's maps pinned in the tc globals directory
      ansible.builtin.find:
        paths: /sys/fs/bpf/tc/globals
        patterns: 'cilium_*'
        file_type: any
      register: _cilium_tc_maps

    - name: Remove Cilium's maps pinned in the tc globals directory
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _cilium_tc_maps.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove Cilium's policy routing rules and route tables
      ansible.builtin.script: files/cilium-ip-rules-cleanup.sh
      register: _cilium_ip_rules
      changed_when: _cilium_ip_rules.stdout | length > 0

    - name: Unmount Cilium's cgroup2 mount
      ansible.builtin.command: umount /run/cilium/cgroupv2
      when: ansible_facts.mounts | selectattr('mount', 'equalto', '/run/cilium/cgroupv2') | list | length > 0
      changed_when: true

    - name: Remove Cilium's runtime state directory
      ansible.builtin.file:
        path: /run/cilium
        state: absent

    # =====================================================================
    # UFW rule cleanup
    # =====================================================================
    # Each rule is deleted by the spec the join added it with; ufw reports
    # a rule that is already gone and exits 0. UFW stays enabled: the join
    # requires it enabled, so that state predates the join. Kept: 22/tcp
    # and SSH from the ZeroTier subnet, so SSH keeps working, and every
    # rule the join did not add.
    - name: Remove worker UFW rules
      block:
        - name: Remove kubelet API rule (10250/tcp)
          community.general.ufw:
            rule: allow
            port: '10250'
            proto: tcp
            delete: true

        - name: Remove node-local API VIP rule (6443/tcp)
          community.general.ufw:
            rule: allow
            port: '6443'
            proto: tcp
            delete: true

        - name: Remove LLMNR rule (5355/udp)
          community.general.ufw:
            rule: allow
            port: '5355'
            proto: udp
            delete: true

        - name: Remove Cilium health rule (4240/tcp)
          community.general.ufw:
            rule: allow
            port: '4240'
            proto: tcp
            delete: true

        - name: Remove Cilium VXLAN rule (8472/udp)
          community.general.ufw:
            rule: allow
            port: '8472'
            proto: udp
            delete: true

        - name: Remove Cilium agent metrics rule (9962/tcp)
          community.general.ufw:
            rule: allow
            port: '9962'
            proto: tcp
            delete: true

        - name: Remove inbound cilium_host interface rule
          community.general.ufw:
            rule: allow
            interface: cilium_host
            direction: in
            delete: true

        - name: Remove outbound cilium_host interface rule
          community.general.ufw:
            rule: allow
            interface: cilium_host
            direction: out
            delete: true

        # The SSH-over-ZeroTier rule (port 22 from the ZeroTier subnet)
        # stays; port 22 stays open on every interface.
        - name: Remove inbound ZeroTier interface rule
          community.general.ufw:
            rule: allow
            interface: "zt+"
            direction: in
            delete: true
          when: overlay_provider == 'zerotier'

        - name: Remove outbound ZeroTier interface rule
          community.general.ufw:
            rule: allow
            interface: "zt+"
            direction: out
            delete: true
          when: overlay_provider == 'zerotier'

    # The join's lineinfile keeps a backup of /etc/default/ufw only when
    # it changes the file, named ufw.<pid>.<date>@<time>~. The newest one
    # holds the line as it was before this join; no backup means the join
    # found the line already set to ACCEPT.
    - name: Find the join's backups of /etc/default/ufw
      ansible.builtin.find:
        paths: /etc/default
        patterns: 'ufw.*~'
      register: _ufw_default_backups

    - name: Read the forward policy line from the newest backup
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s\n' {{ _ufw_default_backups.files | map(attribute='path') | map('quote') | join(' ') }} \
          | sort -t. -k3 | tail -n 1 \
          | xargs awk '/^DEFAULT_FORWARD_POLICY=/'
      args:
        executable: /bin/bash
      register: _ufw_forward_policy_before
      when: _ufw_default_backups.matched > 0
      changed_when: false

    - name: Restore the UFW forward policy from before the join
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        line: "{{ _ufw_forward_policy_before.stdout_lines | last }}"
      when:
        - _ufw_default_backups.matched > 0
        - _ufw_forward_policy_before.stdout_lines | length > 0
      register: _ufw_forward_restored

    # The join appends the line when the file had none.
    - name: Remove the UFW forward policy line the join appended
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        state: absent
      when:
        - _ufw_default_backups.matched > 0
        - _ufw_forward_policy_before.stdout_lines | length == 0
      register: _ufw_forward_removed

    # ufw reload re-applies the rules without disabling the firewall;
    # established connections, the SSH session among them, continue.
    - name: Reload UFW to apply the restored forward policy
      ansible.builtin.command: ufw reload
      when: _ufw_forward_restored is changed or _ufw_forward_removed is changed
      changed_when: true

    - name: Remove the join's backups of /etc/default/ufw
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _ufw_default_backups.files }}"
      loop_control:
        label: "{{ item.path }}"

    # =====================================================================
    # iptables: only the chains kubelet and Cilium own
    # =====================================================================
    # UFW's chains, Docker's chains and the built-in chains' policies are
    # not touched, so the firewall and the SSH session stay as they are.
    - name: Remove the KUBE-* and CILIUM_* iptables chains and the jumps to them
      ansible.builtin.script: files/k8s-iptables-cleanup.sh
      register: _k8s_iptables_cleanup
      changed_when: _k8s_iptables_cleanup.stdout | length > 0

    # No automatic reboot — if the operator wants a clean kernel state
    # after rollback, they can reboot the worker manually. Keeping the
    # playbook side-effect-bounded to "cleanup only" makes it safe to
    # re-run and avoids surprises in unattended orchestration.

  post_tasks:
    - name: Display worker cleanup summary
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "Worker {{ inventory_hostname }} wiped"
          - "==============================================="


- name: Final verification on control plane
  hosts: k8s_control_plane
  become: false
  gather_facts: false

  vars:
    user: "{{ system_username }}"
    user_home: "/home/{{ user }}"
    kubectl_path: "{{ user_home }}/.local/bin/kubectl"

  tasks:
    - name: Count remaining nodes
      ansible.builtin.shell: |
        {{ kubectl_path }} get nodes --no-headers | wc -l
      environment:
        KUBECONFIG: "{{ user_home }}/.kube/config"
      register: _final_node_count
      changed_when: false

    - name: Display final cluster status
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "Worker Rollback Summary"
          - "==============================================="
          - "Workers wiped:               {{ groups['k8s_workers'] | length }}"
          - "Remaining nodes in cluster:  {{ _final_node_count.stdout }}"
          - "==============================================="
