---
# ansible/40_thinkube/core/infrastructure/gateway-api/18_test.yaml
# Validates the Envoy Gateway API deployment
#
# 🤖 [AI-assisted]

- name: Test Gateway API Deployment
  hosts: k8s_control_plane
  become: false
  gather_facts: false
  vars:
    # As in 10_deploy.yaml: the Gateway has a fixed address only in ZeroTier
    # mode; in Tailscale mode the operator assigns one at runtime.
    subnet_prefix: "{{ overlay_subnet_prefix if overlay_provider == 'zerotier' else network_cidr.split('/')[0] | regex_replace('\\.[0-9]+$', '.') }}"
    primary_gateway_ip: "{{ subnet_prefix }}{{ primary_gateway_ip_octet }}"
    gateway_namespace: "gateway-system"
    gateway_name: "thinkube-gateway"

  tasks:
    - name: Verify Gateway API CRDs are installed
      ansible.builtin.shell: |
        {{ kubectl_bin }} get crd gateways.gateway.networking.k8s.io httproutes.gateway.networking.k8s.io tcproutes.gateway.networking.k8s.io
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Verify GatewayClass 'eg' is accepted by Envoy Gateway
      ansible.builtin.shell: |
        {{ kubectl_bin }} get gatewayclass eg -o jsonpath='{.spec.controllerName} {.status.conditions[?(@.type=="Accepted")].status}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: gc_check
      changed_when: false
      failed_when: gc_check.stdout != "gateway.envoyproxy.io/gatewayclass-controller True"

    - name: Verify gateway-system namespace exists
      ansible.builtin.shell: |
        {{ kubectl_bin }} get namespace {{ gateway_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Verify Primary Gateway exists and has an address
      ansible.builtin.shell: |
        {{ kubectl_bin }} get gateway {{ gateway_name }} -n {{ gateway_namespace }} -o jsonpath='{.status.addresses[0].value}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: primary_ip
      changed_when: false
      failed_when: >-
        primary_ip.stdout == ''
        or (overlay_provider == 'zerotier' and primary_ip.stdout != primary_gateway_ip)

    - name: Verify TLS secrets exist in gateway-system
      ansible.builtin.shell: |
        {{ kubectl_bin }} get secret {{ item }} -n {{ gateway_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop:
        - gateway-tls-secret
      changed_when: false

    - name: Verify TCPRoutes exist
      ansible.builtin.shell: |
        {{ kubectl_bin }} get tcproute -n {{ gateway_namespace }} --no-headers | wc -l
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: tcproute_count
      changed_when: false
      failed_when: tcproute_count.stdout | int < 5

    - name: Verify Primary Gateway listeners are accepted
      ansible.builtin.shell: |
        {{ kubectl_bin }} get gateway {{ gateway_name }} -n {{ gateway_namespace }} \
          -o jsonpath='{range .status.listeners[*]}{.name}={.conditions[?(@.type=="Accepted")].status}{"\n"}{end}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: listener_status
      changed_when: false
      failed_when: listener_status.stdout_lines | length == 0 or listener_status.stdout_lines | reject('search', '=True$') | list | length > 0

    - name: Verify the gateway removes user identity headers sent by clients
      ansible.builtin.shell: |
        {{ kubectl_bin }} get clienttrafficpolicy strip-identity-headers -n {{ gateway_namespace }} \
          -o jsonpath='{.status.ancestors[0].conditions[?(@.type=="Accepted")].status} {.spec.headers.earlyRequestHeaders.remove}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: strip_headers_check
      changed_when: false
      failed_when: >-
        strip_headers_check.rc != 0
        or not strip_headers_check.stdout.startswith('True ')
        or 'X-Auth-Request-Email' not in strip_headers_check.stdout

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "Gateway API tests passed"
          - "Primary Gateway: {{ primary_ip.stdout }} ({{ gateway_name }})"
          - "Knative services use DomainMapping through the main gateway"
          - "TCPRoutes: {{ tcproute_count.stdout | trim }}"
          - "Listener status:"
          - "{{ listener_status.stdout_lines }}"
