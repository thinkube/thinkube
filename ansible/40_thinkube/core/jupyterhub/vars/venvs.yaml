#
# Release tag of github.com/thinkube/thinkube-venvs.
# 11_deploy.yaml renders it into the setup-venvs init container (download).
# 99_build_venvs.yaml builds and publishes the venvs under this tag.
---
jupyter_venvs_version: "v0.1.0"

# The sections of venv-packages.txt whose packages need a GPU. A venv that
# includes one is kept only on Thinkube GPU nodes (baremetal_gpus): a notebook
# server elsewhere does not download it, and thinkube-control builds and copies
# it only there. thinkube-control reads this list from this file.
venv_gpu_sections:
  - fine-tuning
  - unsloth
