---
# ansible/40_thinkube/core/jupyterhub/16_configure_code_server_storage.yaml
# Description:
#   Configure code-server to mount JuiceFS storage shared with JupyterHub
#   Creates static PVs pointing to same JuiceFS paths as JupyterHub dynamic PVs
#   Also mounts the Mill folder: the folder "mill" at the root of the shared
#   file system, which holds the user's Mill tasks repository. The Mill
#   extension of Thinkube Control mounts the same folder.
#
# Requirements:
#   - JupyterHub must be deployed with JuiceFS PVCs
#   - code-server must be deployed
#
# Usage:
#   Called from 00_install.yaml orchestration after JupyterHub deployment
#
# 🤖 AI-assisted

- name: Configure Code Server with JuiceFS Storage
  hosts: k8s_control_plane
  gather_facts: false

  vars:
    code_server_namespace: "code-server"
    jupyterhub_namespace: "jupyterhub"
    juicefs_namespace: "juicefs"
    # The Mill folder, at the root of the shared file system
    mill_subpath: "mill"

  tasks:
    ###################################################################
    # 1) Discover subPaths from existing JupyterHub PVs
    ###################################################################
    - name: Get JupyterHub notebooks PVC
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: PersistentVolumeClaim
        namespace: "{{ jupyterhub_namespace }}"
        name: jupyterhub-notebooks-pvc
      register: notebooks_pvc

    - name: Get JupyterHub datasets PVC
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: PersistentVolumeClaim
        namespace: "{{ jupyterhub_namespace }}"
        name: jupyterhub-datasets-pvc
      register: datasets_pvc

    - name: Get JupyterHub models PVC
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: PersistentVolumeClaim
        namespace: "{{ jupyterhub_namespace }}"
        name: jupyterhub-models-pvc
      register: models_pvc

    - name: Check if JupyterHub PVCs exist
      ansible.builtin.assert:
        that:
          - notebooks_pvc.resources | length > 0
          - datasets_pvc.resources | length > 0
          - models_pvc.resources | length > 0
        fail_msg: "JupyterHub PVCs not found. Ensure JupyterHub is deployed first."

    - name: Get notebooks PV details
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: PersistentVolume
        name: "{{ notebooks_pvc.resources[0].spec.volumeName }}"
      register: notebooks_pv

    - name: Get datasets PV details
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: PersistentVolume
        name: "{{ datasets_pvc.resources[0].spec.volumeName }}"
      register: datasets_pv

    - name: Get models PV details
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: PersistentVolume
        name: "{{ models_pvc.resources[0].spec.volumeName }}"
      register: models_pv

    - name: Extract subPaths from JupyterHub PVs
      ansible.builtin.set_fact:
        notebooks_subpath: "{{ notebooks_pv.resources[0].spec.csi.volumeAttributes.subPath }}"
        datasets_subpath: "{{ datasets_pv.resources[0].spec.csi.volumeAttributes.subPath }}"
        models_subpath: "{{ models_pv.resources[0].spec.csi.volumeAttributes.subPath }}"

    - name: Display discovered subPaths
      ansible.builtin.debug:
        msg:
          - "Notebooks subPath: {{ notebooks_subpath }}"
          - "Datasets subPath: {{ datasets_subpath }}"
          - "Models subPath: {{ models_subpath }}"

    ###################################################################
    # 2) Create static PVs for code-server
    # Note: PV spec is immutable, skip if already exists
    ###################################################################
    - name: Check existing code-server PVs
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: PersistentVolume
        name: "{{ item }}"
      loop:
        - code-server-notebooks-pv
        - code-server-datasets-pv
        - code-server-models-pv
        - code-server-mlflow-pv
        - code-server-mill-pv
      register: existing_pvs

    - name: Set existing PV names
      ansible.builtin.set_fact:
        existing_pv_names: "{{ existing_pvs.results | selectattr('resources', 'defined') | selectattr('resources') | map(attribute='item') | list }}"

    - name: Create static PV for code-server notebooks
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: code-server-notebooks-pv
          spec:
            accessModes:
              - ReadWriteMany
            capacity:
              storage: 100Gi
            csi:
              driver: csi.juicefs.com
              fsType: juicefs
              nodePublishSecretRef:
                name: juicefs-secret
                namespace: "{{ juicefs_namespace }}"
              volumeAttributes:
                subPath: "{{ notebooks_subpath }}"
              volumeHandle: code-server-notebooks
            persistentVolumeReclaimPolicy: Retain
            volumeMode: Filesystem
      when: "'code-server-notebooks-pv' not in existing_pv_names"

    - name: Create static PV for code-server datasets
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: code-server-datasets-pv
          spec:
            accessModes:
              - ReadWriteMany
            capacity:
              storage: 500Gi
            csi:
              driver: csi.juicefs.com
              fsType: juicefs
              nodePublishSecretRef:
                name: juicefs-secret
                namespace: "{{ juicefs_namespace }}"
              volumeAttributes:
                subPath: "{{ datasets_subpath }}"
              volumeHandle: code-server-datasets
            persistentVolumeReclaimPolicy: Retain
            volumeMode: Filesystem
      when: "'code-server-datasets-pv' not in existing_pv_names"

    - name: Create static PV for code-server models
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: code-server-models-pv
          spec:
            accessModes:
              - ReadWriteMany
            capacity:
              storage: 200Gi
            csi:
              driver: csi.juicefs.com
              fsType: juicefs
              nodePublishSecretRef:
                name: juicefs-secret
                namespace: "{{ juicefs_namespace }}"
              volumeAttributes:
                subPath: "{{ models_subpath }}"
              volumeHandle: code-server-models
            persistentVolumeReclaimPolicy: Retain
            volumeMode: Filesystem
      when: "'code-server-models-pv' not in existing_pv_names"

    - name: Create static PV for code-server mlflow
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: code-server-mlflow-pv
          spec:
            accessModes:
              - ReadWriteMany
            capacity:
              storage: 1Ti
            csi:
              driver: csi.juicefs.com
              fsType: juicefs
              nodePublishSecretRef:
                name: juicefs-mlflow-secret
                namespace: "{{ juicefs_namespace }}"
              volumeHandle: code-server-mlflow
            persistentVolumeReclaimPolicy: Retain
            volumeMode: Filesystem
      when: "'code-server-mlflow-pv' not in existing_pv_names"

    - name: Create static PV for the code-server Mill folder
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: code-server-mill-pv
          spec:
            accessModes:
              - ReadWriteMany
            capacity:
              storage: 100Gi
            csi:
              driver: csi.juicefs.com
              fsType: juicefs
              nodePublishSecretRef:
                name: juicefs-secret
                namespace: "{{ juicefs_namespace }}"
              volumeAttributes:
                subPath: "{{ mill_subpath }}"
              volumeHandle: code-server-mill
            persistentVolumeReclaimPolicy: Retain
            volumeMode: Filesystem
      when: "'code-server-mill-pv' not in existing_pv_names"

    ###################################################################
    # 3) Create PVCs in code-server namespace
    ###################################################################
    - name: Create PVC for code-server notebooks
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: code-server-notebooks-pvc
            namespace: "{{ code_server_namespace }}"
          spec:
            accessModes:
              - ReadWriteMany
            volumeName: code-server-notebooks-pv
            storageClassName: ""
            resources:
              requests:
                storage: 100Gi

    - name: Create PVC for code-server datasets
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: code-server-datasets-pvc
            namespace: "{{ code_server_namespace }}"
          spec:
            accessModes:
              - ReadWriteMany
            volumeName: code-server-datasets-pv
            storageClassName: ""
            resources:
              requests:
                storage: 500Gi

    - name: Create PVC for code-server models
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: code-server-models-pvc
            namespace: "{{ code_server_namespace }}"
          spec:
            accessModes:
              - ReadWriteMany
            volumeName: code-server-models-pv
            storageClassName: ""
            resources:
              requests:
                storage: 200Gi

    - name: Create PVC for code-server mlflow
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: code-server-mlflow-pvc
            namespace: "{{ code_server_namespace }}"
          spec:
            accessModes:
              - ReadWriteMany
            volumeName: code-server-mlflow-pv
            storageClassName: ""
            resources:
              requests:
                storage: 1Ti

    - name: Create PVC for the code-server Mill folder
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: code-server-mill-pvc
            namespace: "{{ code_server_namespace }}"
          spec:
            accessModes:
              - ReadWriteMany
            volumeName: code-server-mill-pv
            storageClassName: ""
            resources:
              requests:
                storage: 100Gi

    # The driver creates the folder owned by root; the IDE and the Mill pod
    # write to it as user 1000, group 100, like the other shared folders.
    - name: Remove an earlier Mill folder ownership pod
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Pod
        namespace: "{{ code_server_namespace }}"
        name: code-server-mill-folder
        wait: true

    - name: Give the Mill folder to the IDE user
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: code-server-mill-folder
            namespace: "{{ code_server_namespace }}"
          spec:
            restartPolicy: Never
            containers:
              - name: own
                image: "{{ harbor_registry }}/{{ library_project | default('library') }}/busybox:latest"
                command: ["sh", "-c", "chown 1000:100 /mill && chmod 755 /mill"]
                securityContext:
                  runAsUser: 0
                volumeMounts:
                  - name: mill
                    mountPath: /mill
            volumes:
              - name: mill
                persistentVolumeClaim:
                  claimName: code-server-mill-pvc

    - name: Wait for the Mill folder ownership pod to finish
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Pod
        namespace: "{{ code_server_namespace }}"
        name: code-server-mill-folder
      register: mill_folder_pod
      until: >-
        mill_folder_pod.resources | length > 0 and
        mill_folder_pod.resources[0].status.phase in ['Succeeded', 'Failed']
      retries: 60
      delay: 5

    - name: Fail when the Mill folder could not be given to the IDE user
      ansible.builtin.fail:
        msg: >-
          The pod code-server-mill-folder in {{ code_server_namespace }} failed to set the owner of the
          Mill folder. Read its log: kubectl logs -n {{ code_server_namespace }} code-server-mill-folder
      when: mill_folder_pod.resources[0].status.phase != 'Succeeded'

    - name: Remove the Mill folder ownership pod
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: Pod
        namespace: "{{ code_server_namespace }}"
        name: code-server-mill-folder

    ###################################################################
    # 4) Patch code-server deployment to add volumes and mounts
    ###################################################################
    - name: Patch code-server deployment with JuiceFS volumes
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        merge_type: strategic-merge
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: code-server
            namespace: "{{ code_server_namespace }}"
          spec:
            template:
              spec:
                containers:
                  - name: code-server
                    volumeMounts:
                      - name: thinkube-ai-notebooks
                        mountPath: /home/thinkube/thinkube-ai/notebooks
                      - name: thinkube-ai-datasets
                        mountPath: /home/thinkube/thinkube-ai/datasets
                      - name: thinkube-ai-models
                        mountPath: /home/thinkube/thinkube-ai/models
                      - name: thinkube-ai-mlflow
                        mountPath: /home/thinkube/thinkube-ai/mlflow
                      - name: thinkube-ai-mill
                        mountPath: /home/thinkube/thinkube-ai/mill
                volumes:
                  - name: thinkube-ai-notebooks
                    persistentVolumeClaim:
                      claimName: code-server-notebooks-pvc
                  - name: thinkube-ai-datasets
                    persistentVolumeClaim:
                      claimName: code-server-datasets-pvc
                  - name: thinkube-ai-models
                    persistentVolumeClaim:
                      claimName: code-server-models-pvc
                  - name: thinkube-ai-mlflow
                    persistentVolumeClaim:
                      claimName: code-server-mlflow-pvc
                  - name: thinkube-ai-mill
                    persistentVolumeClaim:
                      claimName: code-server-mill-pvc
      register: code_server_patch

    ###################################################################
    # 5) Restart code-server only if volumes were actually changed
    ###################################################################
    - name: Restart code-server deployment
      ansible.builtin.shell: |
        {{ kubectl_bin }} rollout restart deployment/code-server -n {{ code_server_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: true
      when: code_server_patch.changed

    - name: Wait for code-server to be ready
      ansible.builtin.shell: |
        {{ kubectl_bin }} rollout status deployment/code-server -n {{ code_server_namespace }} --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false
      when: code_server_patch.changed

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "Code-server JuiceFS storage configured successfully!"
          - ""
          - "Mount points available in code-server:"
          - "  /home/thinkube/thinkube-ai/notebooks - JupyterHub notebooks"
          - "  /home/thinkube/thinkube-ai/datasets  - Shared datasets"
          - "  /home/thinkube/thinkube-ai/models    - User models"
          - "  /home/thinkube/thinkube-ai/mlflow    - MLflow artifacts"
          - "  /home/thinkube/thinkube-ai/mill      - Mill tasks repository"
          - ""
          - "These are the same files accessible from JupyterHub at /home/jovyan/thinkube/"
