---
# roles/gateway_oidc/tasks/main.yaml
# Requires a Keycloak login on HTTPRoutes. The Envoy Gateway checks every
# request: without a valid session cookie it redirects the browser to
# Keycloak, and it handles the callback at /oauth2/callback itself.
#
# Required variables:
#   gateway_oidc_namespace: Namespace of the HTTPRoutes
#   gateway_oidc_route_names: HTTPRoutes that require the login
#   gateway_oidc_hostname: Hostname the browser uses (for the callback URL)
#   gateway_oidc_client_id: Keycloak client ID
#   gateway_oidc_client_secret: Keycloak client secret
#
# Optional variables:
#   gateway_oidc_claim_headers: Claims copied into request headers, as
#     [{header: X-Auth-Request-Email, claim: email}]. The gateway sets these
#     headers from the verified Keycloak token and replaces any value the
#     client sent. For this the gateway passes the session's Keycloak access
#     token on as "Authorization: Bearer", where the JWT check reads it. The
#     backend then receives that header too, unless the routes remove it with
#     a RequestHeaderModifier filter (route filters run after the JWT check).
#
# The Keycloak client must allow the redirect URI
# https://<gateway_oidc_hostname>/oauth2/callback.

- name: Check the required gateway_oidc variables
  ansible.builtin.assert:
    that:
      - gateway_oidc_namespace | default('') | length > 0
      - gateway_oidc_route_names | default([]) | length > 0
      - gateway_oidc_hostname | default('') | length > 0
      - gateway_oidc_client_id | default('') | length > 0
      - gateway_oidc_client_secret | default('') | length > 0
    fail_msg: >-
      gateway_oidc needs gateway_oidc_namespace, gateway_oidc_route_names,
      gateway_oidc_hostname, gateway_oidc_client_id and
      gateway_oidc_client_secret.
    quiet: true

- name: Store the Keycloak client secret for the gateway
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ gateway_oidc_client_id }}-oidc-client"
        namespace: "{{ gateway_oidc_namespace }}"
      type: Opaque
      stringData:
        client-secret: "{{ gateway_oidc_client_secret }}"
  no_log: true

- name: Build the OIDC settings
  ansible.builtin.set_fact:
    gateway_oidc_spec:
      provider:
        issuer: "{{ keycloak_url }}/realms/{{ keycloak_realm }}"
      clientID: "{{ gateway_oidc_client_id }}"
      clientSecret:
        name: "{{ gateway_oidc_client_id }}-oidc-client"
      redirectURL: "https://{{ gateway_oidc_hostname }}/oauth2/callback"
      logoutPath: /oauth2/logout
      refreshToken: true
      # The JWT check below reads the token from the Authorization header.
      forwardAccessToken: "{{ gateway_oidc_claim_headers | length > 0 }}"

- name: Require a Keycloak login on the routes
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    apply: true
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: "{{ gateway_oidc_client_id }}-oidc"
        namespace: "{{ gateway_oidc_namespace }}"
      spec: >-
        {{
          {
            'targetRefs': gateway_oidc_route_names | map('community.general.dict_kv', 'name')
                          | map('combine', {'group': 'gateway.networking.k8s.io', 'kind': 'HTTPRoute'}) | list,
            'oidc': gateway_oidc_spec
          }
          | combine({} if gateway_oidc_claim_headers | length == 0 else {
            'jwt': {
              'providers': [{
                'name': 'keycloak',
                'issuer': keycloak_url ~ '/realms/' ~ keycloak_realm,
                'remoteJWKS': {'uri': keycloak_url ~ '/realms/' ~ keycloak_realm ~ '/protocol/openid-connect/certs'},
                'claimToHeaders': gateway_oidc_claim_headers
              }]
            }
          })
        }}

- name: Wait for the gateway to accept the policy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    name: "{{ gateway_oidc_client_id }}-oidc"
    namespace: "{{ gateway_oidc_namespace }}"
  register: gateway_oidc_policy
  until: >-
    gateway_oidc_policy.resources | length > 0
    and (gateway_oidc_policy.resources[0].status.ancestors | default([]) | length > 0)
    and (gateway_oidc_policy.resources[0].status.ancestors[0].conditions
         | selectattr('type', 'equalto', 'Accepted') | map(attribute='status') | list) == ['True']
  retries: 12
  delay: 5

- name: Check that a request without a login is sent to Keycloak
  ansible.builtin.uri:
    url: "https://{{ gateway_oidc_hostname }}/"
    follow_redirects: none
    status_code: 302
  register: gateway_oidc_probe
  until: >-
    gateway_oidc_probe.status == 302
    and gateway_oidc_probe.location is defined
    and gateway_oidc_probe.location.startswith(keycloak_url ~ '/realms/' ~ keycloak_realm ~ '/protocol/openid-connect/auth')
  retries: 12
  delay: 5
