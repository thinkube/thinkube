---
# ansible/roles/code_server_env_update/tasks/main.yaml
# Description:
#   Updates code-server environment variables from all deployed optional services
#   This role queries service discovery ConfigMaps and extracts environment variables
#
# Usage:
#   include_role:
#     name: code_server_env_update
#
# Requirements:
#   - Kubernetes cluster access
#   - kubeconfig and kubectl_bin variables defined
#
# 🤖 AI-assisted

- name: Check if code-server pod exists
  ansible.builtin.shell: |
    {{ kubectl_bin }} get pods -n code-server -l app=code-server -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo ""
  register: code_server_pod_check
  changed_when: false
  failed_when: false

- name: Set code-server pod name fact
  ansible.builtin.set_fact:
    code_server_pod_name: "{{ code_server_pod_check.stdout | trim }}"

- name: Skip if code-server not deployed
  ansible.builtin.debug:
    msg: "Code-server not deployed, skipping environment update"
  when: code_server_pod_name == ""

- name: Get all service discovery ConfigMaps
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: ConfigMap
    label_selectors:
      - thinkube.io/managed=true
  register: service_configmaps
  when: code_server_pod_name != ""

- name: Collect the environment variables all services declare
  ansible.builtin.set_fact:
    declared_env_vars: >-
      {{
        service_configmaps.resources
        | map(attribute='data')
        | map('dict2items')
        | flatten
        | selectattr('key', 'equalto', 'service.yaml')
        | map(attribute='value')
        | map('from_yaml')
        | selectattr('service', 'defined')
        | map(attribute='service')
        | selectattr('environment_variables', 'defined')
        | map(attribute='environment_variables')
        | flatten
        | list
      }}
  when:
    - code_server_pod_name != ""
    - service_configmaps.resources | length > 0

# A variable is declared either with a literal value or with
# valueFrom.secretKeyRef (namespace, name, key); anything else is an error.
- name: Refuse a variable declared without a value or a Secret reference
  ansible.builtin.fail:
    msg: >-
      Service discovery declares {{ item.name }} with neither `value` nor
      `valueFrom.secretKeyRef` (namespace, name, key).
  loop: "{{ declared_env_vars | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    item.value is not defined and
    (item.valueFrom is not defined or item.valueFrom.secretKeyRef is not defined or
     item.valueFrom.secretKeyRef.namespace is not defined or
     item.valueFrom.secretKeyRef.name is not defined or
     item.valueFrom.secretKeyRef.key is not defined)

- name: Read the Secrets the declared variables refer to
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Secret
    namespace: "{{ item.valueFrom.secretKeyRef.namespace }}"
    name: "{{ item.valueFrom.secretKeyRef.name }}"
  loop: "{{ declared_env_vars | default([]) | rejectattr('value', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: env_secrets
  failed_when: >-
    env_secrets.resources | length == 0 or
    item.valueFrom.secretKeyRef.key not in (env_secrets.resources[0].data | default({}))

- name: Start the resolved variable list
  ansible.builtin.set_fact:
    all_env_vars: []
  when: code_server_pod_name != ""

- name: Add the variables declared with a literal value
  ansible.builtin.set_fact:
    all_env_vars: "{{ all_env_vars + [{'name': item.name, 'value': item.value}] }}"
  loop: "{{ declared_env_vars | default([]) | selectattr('value', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: code_server_pod_name != ""

- name: Add the variables read from Secrets
  ansible.builtin.set_fact:
    all_env_vars: >-
      {{ all_env_vars + [{'name': item.item.name,
                          'value': item.resources[0].data[item.item.valueFrom.secretKeyRef.key] | b64decode}] }}
  loop: "{{ env_secrets.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: code_server_pod_name != ""

- name: Generate service environment file content (Bash/Zsh)
  ansible.builtin.set_fact:
    service_env_bash_content: |
      #!/bin/bash
      # Auto-generated from service discovery ConfigMaps
      # DO NOT EDIT MANUALLY - Changes will be overwritten
      # Regenerated on code-server configuration and service deployments
      # Generated: {{ ansible_facts.date_time.iso8601 }}

      {% if all_env_vars is defined and all_env_vars | length > 0 %}
      {% for env_var in all_env_vars %}
      export {{ env_var.name }}="{{ env_var.value }}"
      {% endfor %}
      {% else %}
      # No environment variables defined by optional services
      {% endif %}
  when: code_server_pod_name != ""

- name: Generate service environment file content (Fish)
  ansible.builtin.set_fact:
    service_env_fish_content: |
      #!/usr/bin/env fish
      # Auto-generated from service discovery ConfigMaps
      # DO NOT EDIT MANUALLY - Changes will be overwritten
      # Regenerated on code-server configuration and service deployments
      # Generated: {{ ansible_facts.date_time.iso8601 }}

      {% if all_env_vars is defined and all_env_vars | length > 0 %}
      {% for env_var in all_env_vars %}
      set -gx {{ env_var.name }} "{{ env_var.value }}"
      {% endfor %}
      {% else %}
      # No environment variables defined by optional services
      {% endif %}
  when: code_server_pod_name != ""

- name: Create thinkube config directory in code-server
  ansible.builtin.shell: |
    {{ kubectl_bin }} exec -n code-server {{ code_server_pod_name }} -- \
      bash -c "mkdir -p /home/thinkube/.config/thinkube"
  when: code_server_pod_name != ""

- name: Update service environment file (Bash/Zsh) in code-server
  ansible.builtin.shell: |
    {{ kubectl_bin }} exec -n code-server {{ code_server_pod_name }} -- \
      bash -c 'cat > /home/thinkube/.config/thinkube/service-env-cs.sh << "EOF"
    {{ service_env_bash_content }}
    EOF'
  when: code_server_pod_name != ""

- name: Update service environment file (Fish) in code-server
  ansible.builtin.shell: |
    {{ kubectl_bin }} exec -n code-server {{ code_server_pod_name }} -- \
      bash -c 'cat > /home/thinkube/.config/thinkube/service-env-cs.fish << "EOF"
    {{ service_env_fish_content }}
    EOF'
  when: code_server_pod_name != ""

# The files hold Secret values; the shells source them, so only the owner reads them.
- name: Restrict the service environment files to their owner
  ansible.builtin.shell: |
    {{ kubectl_bin }} exec -n code-server {{ code_server_pod_name }} -- \
      bash -c "chmod 600 /home/thinkube/.config/thinkube/service-env-cs.sh /home/thinkube/.config/thinkube/service-env-cs.fish"
  when: code_server_pod_name != ""

- name: Add service-env-cs.sh to .bashrc if not present
  ansible.builtin.shell: |
    {{ kubectl_bin }} exec -n code-server {{ code_server_pod_name }} -- \
      bash -c "
        if ! grep -q 'service-env-cs.sh' /home/thinkube/.bashrc 2>/dev/null; then
          echo '' >> /home/thinkube/.bashrc
          echo '# Source service environment variables from deployed services' >> /home/thinkube/.bashrc
          echo '[ -f ~/.config/thinkube/service-env-cs.sh ] && source ~/.config/thinkube/service-env-cs.sh' >> /home/thinkube/.bashrc
          echo '✅ Added service-env-cs.sh to .bashrc'
        else
          echo '✅ service-env-cs.sh already in .bashrc'
        fi
      "
  register: bashrc_update
  changed_when: "'Added' in bashrc_update.stdout"
  when: code_server_pod_name != ""

- name: Add service-env-cs.sh to .zshrc if not present
  ansible.builtin.shell: |
    {{ kubectl_bin }} exec -n code-server {{ code_server_pod_name }} -- \
      bash -c "
        if ! grep -q 'service-env-cs.sh' /home/thinkube/.zshrc 2>/dev/null; then
          echo '' >> /home/thinkube/.zshrc
          echo '# Source service environment variables from deployed services' >> /home/thinkube/.zshrc
          echo '[ -f ~/.config/thinkube/service-env-cs.sh ] && source ~/.config/thinkube/service-env-cs.sh' >> /home/thinkube/.zshrc
          echo '✅ Added service-env-cs.sh to .zshrc'
        else
          echo '✅ service-env-cs.sh already in .zshrc'
        fi
      "
  register: zshrc_update
  changed_when: "'Added' in zshrc_update.stdout"
  when: code_server_pod_name != ""

- name: Add service-env-cs.fish to config.fish if not present
  ansible.builtin.shell: |
    {{ kubectl_bin }} exec -n code-server {{ code_server_pod_name }} -- \
      bash -c "
        if ! grep -q 'service-env-cs.fish' /home/thinkube/.config/fish/config.fish 2>/dev/null; then
          echo '' >> /home/thinkube/.config/fish/config.fish
          echo '# Source service environment variables from deployed services' >> /home/thinkube/.config/fish/config.fish
          echo 'test -f ~/.config/thinkube/service-env-cs.fish; and source ~/.config/thinkube/service-env-cs.fish' >> /home/thinkube/.config/fish/config.fish
          echo '✅ Added service-env-cs.fish to config.fish'
        else
          echo '✅ service-env-cs.fish already in config.fish'
        fi
      "
  register: fish_update
  changed_when: "'Added' in fish_update.stdout"
  when: code_server_pod_name != ""

- name: Display environment variables configured
  ansible.builtin.debug:
    msg:
      - "Code-server environment updated with {{ all_env_vars | default([]) | length }} environment variables"
      - "{% if all_env_vars is defined and all_env_vars | length > 0 %}Variables: {{ all_env_vars | map(attribute='name') | join(', ') }}{% else %}No environment variables configured{% endif %}"
  when: code_server_pod_name != ""
