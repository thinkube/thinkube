---
# Sets and deletes keys of one JSON file in the pod's home, keeping the rest.
# json_file: path relative to the home; json_changes: {merge: [...], delete: [...]}
# (see files/merge_json.py).
- name: "Update ~/{{ json_file }}"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('file', 'merge_json.py') }}"
      - "{{ agent_home_host_path }}/{{ json_file }}"
    stdin: "{{ json_changes | to_json }}"
  become: true
  become_user: "{{ system_username }}"
  register: json_file_result
  changed_when: "'changed' in json_file_result.stdout"
