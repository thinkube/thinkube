---
# roles/keycloak/keycloak_client_delete/tasks/main.yaml
# Deletes a Keycloak client by its clientId. A client that does not exist is
# already gone; any other failure stops the play.
#
# Required variables:
#   keycloak_client_id: clientId of the client to delete
#   keycloak_url, keycloak_realm, keycloak_admin_username,
#   keycloak_admin_password (used by keycloak/keycloak_common)

- name: Include common Keycloak tasks to get admin token
  ansible.builtin.include_role:
    name: keycloak/keycloak_common

- name: Find Keycloak client "{{ keycloak_client_id }}"
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ keycloak_realm }}/clients?clientId={{ keycloak_client_id | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    status_code: 200
  register: keycloak_client_lookup

- name: Delete Keycloak client "{{ keycloak_client_id }}"
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/{{ keycloak_realm }}/clients/{{ keycloak_client_lookup.json[0].id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ keycloak_token.json.access_token }}"
    status_code: 204
  when: keycloak_client_lookup.json | length > 0

- name: Report the Keycloak client deletion
  ansible.builtin.debug:
    msg: >-
      Keycloak client '{{ keycloak_client_id }}'
      {{ 'deleted' if keycloak_client_lookup.json | length > 0 else 'did not exist' }}
      in realm '{{ keycloak_realm }}'.
